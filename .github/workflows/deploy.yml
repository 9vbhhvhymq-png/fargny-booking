name: Deploy to Strato

# Deploys strato-deploy/ to Strato shared hosting via SFTP
# whenever changes are pushed to main.
#
# lftp does the upload: it is the one client here that handles password
# authentication and a recursive mirror in a single step. Plain `sftp -b`
# is not an option, because a batch file forces BatchMode=yes, which
# disables password prompting altogether.
#
# The install used to hang for ten minutes or more on a slow package
# mirror, so every apt call now runs under `timeout` with retries, and
# the job itself is capped. A bad mirror fails loudly instead of
# stalling the deploy.
#
# Required GitHub Secrets:
#   FTP_HOST  — e.g. 512020809.ssh.w1.strato.hosting
#   FTP_USER  — e.g. STU834724242
#   FTP_PASSWORD  — your Strato SFTP password

on:
  push:
    branches:
      - main
    paths:
      - 'strato-deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -uo pipefail

          if command -v lftp >/dev/null 2>&1; then
            echo "lftp already present"; exit 0
          fi

          # Cap how long apt may spend on any single mirror connection,
          # which is where the stalls came from.
          APT_OPTS="-o Acquire::Retries=2
                    -o Acquire::http::Timeout=20
                    -o Acquire::https::Timeout=20
                    -o Acquire::ftp::Timeout=20"

          # The runner image usually ships usable package lists, so try
          # installing straight away before paying for an update.
          if sudo timeout 120 apt-get install -y -qq $APT_OPTS lftp 2>/dev/null; then
            echo "Installed from the existing package lists"; exit 0
          fi

          for attempt in 1 2 3; do
            echo "apt-get update + install, attempt $attempt"
            sudo timeout 120 apt-get update -qq $APT_OPTS || echo "update timed out, trying install anyway"
            if sudo timeout 180 apt-get install -y -qq $APT_OPTS lftp; then
              echo "lftp installed"; exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "Could not install lftp" >&2
          exit 1

      - name: Upload via lftp (SFTP)
        env:
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          HOST="$(printf '%s' "$SFTP_HOST" | tr -d '[:space:]')"
          USER_="$(printf '%s' "$SFTP_USER" | tr -d '[:space:]')"

          timeout 480 lftp --env-password -u "$USER_" "sftp://$HOST" <<'LFTP_EOF'
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          mirror --reverse \
                 --verbose \
                 --exclude-glob .env \
                 --exclude-glob wipe-*.php \
                 --exclude-glob .git* \
                 --exclude-glob node_modules/ \
                 ./strato-deploy/ /STRATO-apps/wordpress_01/app/booking/
          bye
          LFTP_EOF
