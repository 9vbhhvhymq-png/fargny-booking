name: Deploy to Strato

on:
  push:
    branches:
      - main
    paths:
      - 'strato-deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Test SFTP connection
        env:
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_USER: ${{ secrets.FTP_USER }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Testing connection to $SFTP_HOST as $SFTP_USER"
          sshpass -p "$SFTP_PASS" ssh -o StrictHostKeyChecking=no -p 22 "$SFTP_USER@$SFTP_HOST" "pwd && ls" || echo "Connection test failed"

      - name: Deploy via rsync over SSH
        env:
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_USER: ${{ secrets.FTP_USER }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sshpass -p "$SFTP_PASS" rsync -avz --delete \
            --exclude '.env' \
            --exclude 'wipe-*.php' \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            ./strato-deploy/ \
            "$SFTP_USER@$SFTP_HOST:/STRATO-apps/wordpress_01/app/booking/"

      - name: Deploy via SFTP (fallback)
        if: failure()
        env:
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_USER: ${{ secrets.FTP_USER }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sshpass -p "$SFTP_PASS" sftp -oBatchMode=no -oStrictHostKeyChecking=no "$SFTP_USER@$SFTP_HOST" <<EOF
          cd /STRATO-apps/wordpress_01/app/booking
          put strato-deploy/index.html
          put strato-deploy/public-calendar.html
          cd api
          lcd strato-deploy/api
          mput *.php
          lcd ..
          cd ..
          put strato-deploy/.htaccess
          EOF
