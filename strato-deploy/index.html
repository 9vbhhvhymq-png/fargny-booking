      {/* SIDEBAR */}
      <div className="fargny-sidebar" style={{width:300,flexShrink:0,display:'flex',flexDirection:'column',gap:16}}>
        <div style={{background:COLORS.white,borderRadius:14,padding:20,boxShadow:'0 1px 8px rgba(0,0,0,0.04)'}}>
          <h3 style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',letterSpacing:'1px',margin:'0 0 12px 0'}}>{t.bookingPhase}</h3>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {PHASE_ORDER.map(pid=>{
              const pm=getPhaseMeta(pid,t), status=getPhaseStatus(pid,phaseConfig), pc=phaseColor(pid), isCurrent=phase===pid, win=getPhaseWindow(pid,phaseConfig,lang);
              return <button key={pid} onClick={()=>setPhase(pid)} style={{display:'flex',flexDirection:'column',gap:4,padding:'12px 14px',border:isCurrent?'1.5px solid '+pc:'1.5px solid transparent',borderRadius:10,background:isCurrent?pc+'0A':'#F8F5F2',cursor:'pointer',textAlign:'left',opacity:status==='upcoming'||status==='closed'?0.55:1}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:16}}>{pm.icon}</span>
                  <span style={{fontSize:13,fontWeight:600,color:isCurrent?pc:COLORS.text}}>{pm.name}</span>
                  {status==='active' && <span style={{fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:8,background:COLORS.success+'20',color:COLORS.success}}>{t.active}</span>}
                  {status==='closed' && <span style={{fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:8,background:'#DC262620',color:'#DC2626'}}>{t.closed}</span>}
                  {status==='upcoming' && <span style={{fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:8,background:COLORS.warning+'20',color:COLORS.warning}}>{t.opens}</span>}
                </div>
                <div style={{fontSize:11,color:COLORS.muted,marginLeft:24}}>{pm.rule}</div>
                <div style={{fontSize:10,color:isCurrent?pc:COLORS.muted,marginLeft:24,fontWeight:500}}>{win}</div>
              </button>;
            })}
          </div>
        </div>

        <div style={{background:COLORS.white,borderRadius:14,padding:20,boxShadow:'0 1px 8px rgba(0,0,0,0.04)'}}>
          <h3 style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',letterSpacing:'1px',margin:'0 0 12px 0'}}>{t.year}</h3>
          <div style={{display:'flex',gap:8}}>
            {[2026,2027].map(y=><button key={y} onClick={()=>setYear(y)} style={{flex:1,padding:'10px 0',border:year===y?'1.5px solid '+COLORS.success:'1.5px solid '+COLORS.border,borderRadius:8,background:year===y?COLORS.success+'0D':COLORS.white,color:year===y?COLORS.success:COLORS.muted,fontWeight:600,fontSize:14,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{y}</button>)}
          </div>
        </div>

        <div style={{background:COLORS.white,borderRadius:14,padding:20,boxShadow:'0 1px 8px rgba(0,0,0,0.04)'}}>
          {(()=>{
            const myEvents = (boardEvents||[]).filter(ev=>ev.user_signed_up);
            // Stays imported from the old Google Calendar have no account
            // behind them, so match them to the member by name and show them
            // read-only. Matching is deliberately strict (full name, or first
            // name as a whole word) to avoid claiming someone else's stay.
            const myNames = (user.display_name||'').trim().toLowerCase();
            const firstName = myNames.split(/\s+/)[0]||'';
            const myGcal = legacyGcalOnly(gcalEvents, myBookings,
                b=>{const bw=(b.year||year)===year?weeks:generateWeeks(b.year||year);return bw.find(wk=>wk.id===b.week_id);}
              ).filter(ev=>{
              const title=(ev.title||'').toLowerCase(); if(!title||!myNames) return false;
              if(title.includes(myNames)) return true;
              return firstName.length>2 && new RegExp('(^|[^a-z])'+firstName+'([^a-z]|$)','i').test(title);
            });
            const totalCount = myBookings.length + myEvents.length + myGcal.length;
            return <>
              <h3 style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',letterSpacing:'1px',margin:'0 0 12px 0'}}>{t.myBookings} ({totalCount})</h3>
              {totalCount===0 ? <p style={{fontSize:13,color:'#B0A090',margin:0}}>{t.noBookingsYet}</p>
              : <div style={{display:'flex',flexDirection:'column',gap:6}}>
                  {myGcal.map((ev,i)=>(
                    <div key={'g'+i} style={{padding:'8px 12px',background:'#F8F5F2',borderRadius:8,borderLeft:'3px solid '+COLORS.gcal}}>
                      <div style={{fontSize:13,fontWeight:600,color:COLORS.text}}>{formatDate(ev.start_date,lang)} &mdash; {formatDate(ev.end_date||ev.start_date,lang)}</div>
                      <div style={{fontSize:11,color:COLORS.gcal,fontWeight:600,marginTop:2}}>{ev.title} &middot; {t.viaOldCalendar}</div>

                  ))}
                  {myBookings.map(b=>{
                    const bYear=b.year||year;const bWeeks=bYear===year?weeks:generateWeeks(bYear);const w=bWeeks.find(wk=>wk.id===b.week_id);if(!w) return null;
                    const isPending=b.cancellation_status==='pending';const pm=getPhaseMeta(b.phase,t);
                    return <div key={'b'+b.id} style={{padding:'8px 12px',background:isPending?'#FEF2F2':'#F8F5F2',borderRadius:8,borderLeft:'3px solid '+(isPending?COLORS.warning:b.open_to_share?COLORS.openToShare:(userBranch?userBranch.color:'#ccc')),opacity:isPending?0.7:1,cursor:(isPending||isFamily)?'default':'pointer'}} onClick={(isPending||isFamily)?null:()=>setCostBooking(b)}>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <div style={{fontSize:13,fontWeight:500,color:COLORS.text,textDecoration:isPending?'line-through':'none'}}>{bYear!==year?bYear+' \u00B7 ':''}{formatDate(b.check_in_date||w.start,lang)} &mdash; {formatDate(b.check_out_date||w.end,lang)}</div>
                      </div>
                      {isPending ? <div style={{fontSize:11,color:COLORS.warning,marginTop:2,fontWeight:600}}>{'\u23F3'} {t.pendingCancellation}</div>

                  {myEvents.map(ev=>(
                    <div key={'e'+ev.id} onClick={()=>{setPhase('board');setEventDetail(ev);}} style={{padding:'8px 12px',background:'#F8F5F2',borderRadius:8,borderLeft:'3px solid '+COLORS.board,cursor:'pointer'}}>
                      <div style={{fontSize:13,fontWeight:500,color:COLORS.text}}>{formatDate(ev.start_date,lang)} &mdash; {formatDate(ev.end_date,lang)}</div>
                      <div style={{fontSize:11,color:COLORS.board,marginTop:2,fontWeight:600}}>{'\u2728'} {lang==='nl'?'Speciaal Evenement':'Special Event'} &middot; {ev.name}</div>
                    </div>
                  ))}
                </div>}
            </>;

          <h3 style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',letterSpacing:'1px',margin:'0 0 12px 0'}}>{t.familyBranches}</h3>

              <div style={{display:'flex',gap:10}}>
                <label style={{flex:1,fontSize:11,color:COLORS.muted,fontWeight:600}}>{t.eventStart}

              <button onClick={submitEvent} disabled={!evName||!evStart||!evEnd} style={{padding:'10px 0',background:(!evName||!evStart||!evEnd)?'#D4C5B5':COLORS.board,border:'none',borderRadius:10,fontSize:14,fontWeight:600,color:'white',cursor:(!evName||!evStart||!evEnd)?'default':'pointer',fontFamily:"'DM Sans',sans-serif"}}>{editingId?t.saveEvent:t.createBoardEvent}</button>
            </div>}

            {boardEvents.length===0 ? <div style={{padding:40,textAlign:'center',color:COLORS.muted}}>{t.noEvents}</div>
            : <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {boardEvents.map(ev=>{
                  const isMember = ev.user_signed_up;
                  const cnt = ev.signup_count||0;
                  const max = ev.max_participants||null;
                  const full = max!==null && cnt>=max && !isMember;
                  const countLabel = max!==null ? (cnt+' / '+max+' '+t.participants) : (cnt+' '+t.participants);
                  return <div key={ev.id} onClick={()=>setEventDetail(ev)} style={{display:'flex',alignItems:'flex-start',gap:12,padding:'14px 18px',borderRadius:12,background:COLORS.board+'08',borderLeft:'3px solid '+COLORS.board,cursor:'pointer'}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:15,fontWeight:600,color:COLORS.text}}>{ev.name}</div>
                      <div style={{fontSize:13,color:COLORS.muted,marginTop:2}}>{formatDate(ev.start_date,lang)} &ndash; {formatDate(ev.end_date,lang)}</div>
                      {ev.description && <div style={{fontSize:12,color:COLORS.muted,marginTop:4,fontStyle:'italic'}}>{'\u{1F4AC}'} {ev.description}</div>}
                      {ev.creator_name && <div style={{fontSize:11,color:COLORS.muted,marginTop:4}}>{t.createdBy}: <strong>{ev.creator_name}</strong></div>}
                      <div style={{fontSize:12,color:full?COLORS.danger:COLORS.board,marginTop:6,fontWeight:600}}>{countLabel}{full?' \u00b7 '+t.eventFull:''}</div>
                      {ev.participants && ev.participants.length>0 && <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:6}}>

                    </div>
                    <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'stretch'}}>
                      <button onClick={(e)=>{e.stopPropagation();isMember?onUnsignUpBoard(ev.id):(!full&&onSignUpBoard(ev.id));}} disabled={full} style={{padding:'8px 14px',background:full?'#D4C5B5':(isMember?'transparent':COLORS.board),border:isMember?'1.5px solid '+COLORS.board:'none',borderRadius:10,fontSize:12,color:isMember?COLORS.board:'white',cursor:full?'default':'pointer',fontWeight:600,whiteSpace:'nowrap',fontFamily:"'DM Sans',sans-serif",minHeight:44}}>{isMember?('\u2715 '+t.cancelSignup):(full?t.eventFull:('\u2705 '+t.signUp))}</button>
                      {ev.can_delete && onUpdateEvent && <button onClick={(e)=>{e.stopPropagation();startEditEvent(ev);}} style={{padding:'6px 14px',background:'transparent',border:'1.5px solid '+COLORS.board,borderRadius:10,fontSize:11,color:COLORS.board,cursor:'pointer',fontWeight:600,whiteSpace:'nowrap',fontFamily:"'DM Sans',sans-serif"}}>{'\u270f\ufe0f'} {t.editEvent}</button>}
                      {ev.can_delete && onDeleteEvent && <button onClick={(e)=>{e.stopPropagation();onDeleteEvent(ev);}} style={{padding:'6px 14px',background:'transparent',border:'1.5px solid #D4C5B5',borderRadius:10,fontSize:11,color:COLORS.danger,cursor:'pointer',fontWeight:600,whiteSpace:'nowrap',fontFamily:"'DM Sans',sans-serif"}}>{'\ud83d\uddd1'} {t.cancelEvent}</button>}
                    </div>
                  </div>;
                })}
                {eventDetail && <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={()=>setEventDetail(null)}>
                  <div onClick={e=>e.stopPropagation()} style={{background:COLORS.white,borderRadius:14,padding:24,maxWidth:480,width:'100%',maxHeight:'85vh',overflow:'auto',boxShadow:'0 12px 48px rgba(0,0,0,0.18)'}}>
                    <h3 style={{fontSize:18,fontWeight:700,color:COLORS.text,margin:'0 0 4px 0',fontFamily:"'Playfair Display',Georgia,serif"}}>{eventDetail.name}</h3>
                    <div style={{fontSize:12,color:COLORS.muted,marginBottom:14,textTransform:'uppercase',letterSpacing:'0.5px'}}>{t.eventDetails}</div>
                    <div style={{fontSize:13,color:COLORS.text,marginBottom:8}}><strong>{t.eventStart}:</strong> {formatDate(eventDetail.start_date,lang)}</div>
                    <div style={{fontSize:13,color:COLORS.text,marginBottom:8}}><strong>{t.eventEnd}:</strong> {formatDate(eventDetail.end_date,lang)}</div>
                    {eventDetail.creator_name && <div style={{fontSize:13,color:COLORS.text,marginBottom:8}}><strong>{t.createdBy}:</strong> {eventDetail.creator_name}</div>}
                    {eventDetail.description && <div style={{fontSize:13,color:COLORS.text,marginBottom:12,whiteSpace:'pre-wrap'}}>{eventDetail.description}</div>}
                    <div style={{fontSize:13,color:COLORS.board,fontWeight:600,marginBottom:8}}>
                      {(eventDetail.signup_count||0)}{eventDetail.max_participants?(' / '+eventDetail.max_participants):''} {t.participants}
                    </div>
                    {eventDetail.participants && eventDetail.participants.length>0 && <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:14}}>
                      {eventDetail.participants.map(p=><span key={p.user_id} onClick={()=>onOpenProfile&&onOpenProfile(p.user_id)} style={{fontSize:12,padding:'4px 10px',background:COLORS.board+'18',color:COLORS.board,borderRadius:10,fontWeight:500,cursor:onOpenProfile?'pointer':'default'}}>{p.display_name}</span>)}
                    </div>}
                    {eventDetail.can_delete && onUpdateEvent && <button onClick={()=>startEditEvent(eventDetail)} style={{width:'100%',padding:'11px 0',marginBottom:8,background:'transparent',border:'1.5px solid '+COLORS.board,borderRadius:10,fontSize:13,fontWeight:600,color:COLORS.board,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{'✏️'} {t.editEvent}</button>}
                    {eventDetail.can_delete && onDeleteEvent && <button onClick={()=>{const ev=eventDetail;setEventDetail(null);onDeleteEvent(ev);}} style={{width:'100%',padding:'11px 0',marginBottom:8,background:'transparent',border:'1.5px solid '+COLORS.danger,borderRadius:10,fontSize:13,fontWeight:600,color:COLORS.danger,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{'🗑'} {t.cancelEvent}</button>}
                    <button onClick={()=>setEventDetail(null)} style={{width:'100%',padding:'11px 0',background:COLORS.bg,border:'none',borderRadius:10,fontSize:14,fontWeight:600,color:COLORS.text,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.close}</button>
                  </div>
                </div>}
              </div>}
          </div>
        : <>
          <div style={{display:'flex',gap:4,marginBottom:16,flexWrap:'wrap'}}>
            <button onClick={()=>setFilterMonth(null)} style={{padding:'6px 12px',borderRadius:8,border:'none',background:filterMonth===null?COLORS.text:'#E8DFD5',color:filterMonth===null?COLORS.white:COLORS.muted,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.all}</button>
            {MONTHS_SHORT[lang].map((m,i)=>{if(!weeks.some(w=>w.month===i))return null;
              return <button key={m} onClick={()=>setFilterMonth(i)} style={{padding:'6px 12px',borderRadius:8,border:'none',background:filterMonth===i?COLORS.text:'#E8DFD5',color:filterMonth===i?COLORS.white:COLORS.muted,fontSize:12,fontWeight:500,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{m}</button>;})}
          </div>
          {isFamily && <div style={{background:COLORS.board+'0A',border:'1px solid '+COLORS.board+'30',borderRadius:12,padding:'10px 16px',fontSize:12,color:COLORS.board,marginBottom:12,display:'flex',alignItems:'center',gap:8}}>{'\u{1F46A}'} {t.readOnlyNote}</div>}
          <div style={{background:COLORS.white,borderRadius:14,padding:8,boxShadow:'0 1px 8px rgba(0,0,0,0.04)'}}>
            {gcalLoading ? <div style={{padding:40,textAlign:'center',color:COLORS.muted,fontSize:13}}>{'\u{1F504}'} {t.loadingCalendar||'Checking existing calendar\u2026'}</div>
            : filteredWeeks.length===0 ? <div style={{padding:40,textAlign:'center',color:COLORS.muted}}>{t.noWeeks}</div>
            : filteredWeeks.reduce((acc,week,i)=>{
                const prevMonth = i>0 ? filteredWeeks[i-1].month : -1;
                if(week.month!==prevMonth) acc.push(<div key={'month-'+week.month} style={{padding:'14px 16px 6px 16px',fontSize:13,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',letterSpacing:'0.5px',borderTop:i>0?'1px solid #F0EBE5':'none',marginTop:i>0?4:0}}>{MONTHS_SHORT[lang][week.month]} {year}</div>);
                acc.push(<WeekRow key={week.id} week={week} myBooking={myBookingMap[week.id]} allBookings={bookings} gcalEvents={gcalEvents} boardEvents={boardEvents} onBook={(w,partial)=>setBookDialog({week:w,phase,presetCheckIn:partial?partial.freeStart:null,presetCheckOut:partial?partial.freeEnd:null})} onRequestCancel={onRequestCancel} onToggleShare={onToggleShare} onJoinBooking={onJoinBooking} onOpenProfile={onOpenProfile} isFamily={isFamily} onJoinSpecialEvent={(ev)=>{setPhase('board');setEventDetail(ev);}} user={user} phase={phase} clanBookedByBranch={clanBookedByBranch} userBookedPriority={userBookedPriority} phaseActive={getPhaseStatus(phase,phaseConfig)==='active'||user.is_admin} t={t} lang={lang} highlight={highlightWeekId===week.id}/>);
                return acc;
              },[])}
          </div>
        </>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// CALENDAR VIEW
// ═══════════════════════════════════════════════════════
function CalendarView({bookings=[], weeks, year, boardEvents=[], gcalEvents=[], clanRevealed, priorityRevealed, registeredUsers=[], user, t, lang, calMonth, setCalMonth, calYear, setCalYear, onPickDate, onOpenProfile}){
  const [popup, setPopup] = React.useState(null);
  const today = toISO(new Date());
  const someHidden = !clanRevealed || !priorityRevealed;

  const goNext = ()=>{if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1);};
  const goPrev = ()=>{if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1);};
  const daysInMonth = new Date(calYear,calMonth+1,0).getDate();
  const startDow = (new Date(calYear,calMonth,1).getDay()+6)%7;
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  const calWeeks = calYear===year ? weeks : generateWeeks(calYear);
  const allItems = bookings.map(b=>{const w=calWeeks.find(wk=>wk.id===b.week_id);return{type:'booking',data:b,start:b.check_in_date||(w?w.start:''),end:b.check_out_date||(w?w.end:'')};});
  (boardEvents||[]).forEach(ev=>{allItems.push({type:'board',data:ev,start:ev.start_date,end:ev.end_date});});
  // Merge in Google Calendar events that are NOT already app bookings —
  // read-only, shown in grey. A stay booked here that also lives in the
  // shared calendar is shown once, as the app booking it is.
  legacyGcalOnly(gcalEvents, bookings, b=>calWeeks.find(wk=>wk.id===b.week_id))
    .forEach((ev,idx)=>{allItems.push({type:'gcal',data:{...ev,_key:ev.uid||('gcal_'+idx)},start:ev.start_date,end:ev.end_date});});

  const dayBookings = {};
  for(let dd=1;dd<=daysInMonth;dd++){
    const ds = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    dayBookings[dd] = allItems.filter(item=>ds>=item.start&&ds<=item.end);
  }
  const rows = [];for(let ri=0;ri<cells.length;ri+=7) rows.push(cells.slice(ri,ri+7));
  const dayNames = [t.mon,t.tue,t.wed,t.thu,t.fri,t.sat,t.sun];
  const navBtnStyle = {padding:'8px 16px',border:'1.5px solid '+COLORS.border,borderRadius:8,background:COLORS.white,cursor:'pointer',fontSize:16,color:COLORS.text,fontFamily:"'DM Sans',sans-serif"};

  return (
    <div style={{maxWidth:960,margin:'0 auto',padding:'24px 20px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:16,marginBottom:20}}>
        <button onClick={goPrev} style={navBtnStyle}>{'\u25C0'}</button>
        <h2 style={{fontSize:20,fontWeight:700,color:COLORS.text,fontFamily:"'Playfair Display',Georgia,serif",margin:0,minWidth:220,textAlign:'center'}}>{FULL_MONTHS[lang][calMonth]} {calYear}</h2>
        <button onClick={goNext} style={navBtnStyle}>{'\u25B6'}</button>
      </div>
      {someHidden && <div style={{background:'#C4853B10',border:'1px solid #C4853B30',borderRadius:12,padding:'12px 18px',fontSize:13,color:'#8B6030',display:'flex',alignItems:'center',gap:8,marginBottom:16}}>{'\u{1F512}'} {t.hiddenCalNote}</div>}
      <div style={{background:COLORS.white,borderRadius:14,padding:20,boxShadow:'0 1px 8px rgba(0,0,0,0.04)'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:4}}>
          {dayNames.map(name=><div key={name} style={{textAlign:'center',fontSize:11,fontWeight:700,color:COLORS.muted,padding:'8px 0',textTransform:'uppercase',letterSpacing:'0.5px'}}>{name}</div>)}
        </div>
        {rows.map((row,rowIdx)=>
          <div key={rowIdx} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
            {row.map((day,ci)=>{
              if(!day) return <div key={'e'+ci} style={{minHeight:64}}/>;
              const bks = dayBookings[day]||[];
              const ds = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
              const isToday = ds===today;
              const isFree = bks.length===0;
              const cellClickable = isFree && onPickDate && ds>=today;
              return <div key={day} onClick={cellClickable?()=>onPickDate(ds):null} style={{minHeight:64,padding:'3px 2px',position:'relative',border:isToday?'2px solid '+COLORS.accent:'2px solid transparent',borderRadius:6,cursor:cellClickable?'pointer':'default',background:cellClickable?'transparent':undefined}} onMouseEnter={cellClickable?(e)=>{e.currentTarget.style.background=COLORS.success+'14';}:null} onMouseLeave={cellClickable?(e)=>{e.currentTarget.style.background='transparent';}:null}>
                <div style={{fontSize:12,fontWeight:isToday?700:400,color:COLORS.text,textAlign:'center',marginBottom:2}}>{day}</div>
                {bks.slice(0,3).map((item,bi)=>{
                  const isBoard = item.type==='board';
                  const isGcal  = item.type==='gcal';
                  const b = item.data;
                  let barColor, label, isPending=false;
                  if(isBoard){barColor=COLORS.board;label=b.name;}
                  else if(isGcal){barColor=COLORS.gcal;label=b.title;}
                  else{const br=FAMILY_BRANCHES.find(x=>x.id===b.branch_id);isPending=b.cancellation_status==='pending';if(b.is_hidden){barColor='#A89888';label='\u{1F512}';}else{barColor=b.open_to_share?COLORS.openToShare:isPending?(br?br.color:'#ccc')+'40':(br?br.color:'#ccc');label=shortName(b.user_name)+(b.open_to_share?' \u{1F91D}':'');}}
                  const prevDay=ci>0?row[ci-1]:null;const nextDay=ci<6?row[ci+1]:null;
                  const keyFor = x=>x.type==='board'?'board_'+x.data.id:x.type==='gcal'?('gcal_'+(x.data._key||x.data.uid||x.data.title+x.start)):x.data.id;
                  const itemId = keyFor(item);
                  const prevHas=prevDay&&(dayBookings[prevDay]||[]).some(x=>keyFor(x)===itemId);
                  const nextHas=nextDay&&(dayBookings[nextDay]||[]).some(x=>keyFor(x)===itemId);
                  const radius=(!prevHas?'4px ':'0 ')+(!nextHas?'4px ':'0 ')+(!nextHas?'4px ':'0 ')+(!prevHas?'4px':'0');
                  return <div key={itemId+'_'+bi} onClick={e=>{e.stopPropagation();setPopup(item);}} style={{height:16,marginBottom:1,background:barColor+'CC',borderRadius:radius,cursor:'pointer',display:'flex',alignItems:'center',overflow:'hidden',paddingLeft:!prevHas?3:0}}>
                    {!prevHas && <span style={{fontSize:8,fontWeight:700,color:'white',whiteSpace:'nowrap',textOverflow:'ellipsis',overflow:'hidden',textDecoration:isPending?'line-through':'none'}}>{label}</span>}
                  </div>;
                })}
              </div>;
            })}
          </div>
        )}
      </div>

      {popup && <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.2)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={()=>setPopup(null)}>
        <div onClick={e=>e.stopPropagation()} style={{background:COLORS.white,borderRadius:14,padding:24,minWidth:280,maxWidth:400,boxShadow:'0 8px 32px rgba(0,0,0,0.15)'}}>
          {popup.type==='board' ? <>
            <h4 style={{fontSize:16,fontWeight:700,color:COLORS.board,margin:'0 0 8px 0'}}>{'\u{2728}'} {popup.data.name}</h4>
            <div style={{fontSize:13,color:COLORS.text}}>{formatDate(popup.data.start_date,lang)} &ndash; {formatDate(popup.data.end_date,lang)}</div>
            {popup.data.description && <div style={{fontSize:13,color:COLORS.muted,marginTop:6,fontStyle:'italic'}}>{popup.data.description}</div>}
            <div style={{fontSize:12,color:COLORS.board,marginTop:8}}>{popup.data.signup_count||0} {t.participants}</div>
          </> : popup.type==='gcal' ? <>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <div style={{width:12,height:12,borderRadius:3,background:'#9CA3AF'}}/>
              <h4 style={{fontSize:16,fontWeight:700,color:COLORS.text,margin:0}}>{popup.data.title}</h4>
            </div>
            <div style={{fontSize:13,color:COLORS.text}}>{formatDate(popup.data.start_date,lang)} &ndash; {formatDate(popup.data.end_date,lang)}</div>
            {popup.data.description && <div style={{fontSize:13,color:COLORS.muted,marginTop:6,fontStyle:'italic',whiteSpace:'pre-wrap'}}>{popup.data.description}</div>}
            <div style={{fontSize:11,color:COLORS.muted,marginTop:10,padding:'6px 10px',background:'#F3F4F6',borderRadius:6,display:'inline-block'}}>{'\u{1F4C5}'} {t.viaOldCalendar}</div>
          </> : popup.data.is_hidden ? <>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
              <div style={{width:12,height:12,borderRadius:3,background:'#A89888'}}/>
              <h4 style={{fontSize:16,fontWeight:700,color:COLORS.text,margin:0}}>{'\u{1F512}'} {lang==='nl'?'Verborgen boeking':'Hidden booking'}</h4>
            </div>
            <div style={{fontSize:13,color:COLORS.muted}}>{lang==='nl'?'Deze week is geboekt. Details worden onthuld op de openbaardatum.':'This week is booked. Details will be revealed on the reveal date.'}</div>
          </> : <>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
              <div style={{width:12,height:12,borderRadius:3,background:popup.data.open_to_share?COLORS.openToShare:(FAMILY_BRANCHES.find(x=>x.id===popup.data.branch_id)||{color:'#ccc'}).color}}/>
              <h4 style={{fontSize:16,fontWeight:700,color:COLORS.text,margin:0,display:'flex',alignItems:'center',gap:8}}>
                {popup.data.user_id && onOpenProfile
                  ? <MemberLink user={{user_id:popup.data.user_id,display_name:popup.data.user_name,branch_id:popup.data.branch_id}} onOpen={onOpenProfile} size={26} color={COLORS.text}/>
                  : popup.data.user_name}
              </h4>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:6,fontSize:13,color:COLORS.text}}>
              <div><strong>{t.branchLabel}: </strong>{popup.data.branch_name}</div>
              <div><strong>{t.phase}: </strong>{getPhaseName(popup.data.phase,t)}</div>
              {popup.data.remarks && <div style={{fontStyle:'italic',color:COLORS.muted}}><strong>{t.remarkLabel}: </strong>{popup.data.remarks}</div>}
              {popup.data.open_to_share && <div style={{color:COLORS.openToShare,fontWeight:600}}>{'\u{1F91D}'} {t.openToShare}</div>}
            </div>
          </>}
          <button onClick={()=>setPopup(null)} style={{marginTop:16,width:'100%',padding:'10px 0',background:COLORS.bg,border:'none',borderRadius:10,fontSize:14,fontWeight:500,color:'#5A4D40',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.close}</button>
        </div>
      </div>}
    </div>
  );
}

  React.useEffect(()=>{
    setLoading(true);
    api(`stats?year=${year}`).then(d=>{setStats(d);setLoading(false);}).catch(()=>setLoading(false));
  },[year]);

  if(!user.is_admin) return <div style={{maxWidth:600,margin:'0 auto',padding:'60px 20px',textAlign:'center'}}><div style={{fontSize:48,marginBottom:16}}>{'\u{1F512}'}</div><div style={{fontSize:16,color:COLORS.muted}}>{t.adminOnly}</div></div>;

  const card = {background:COLORS.white,borderRadius:14,padding:20,boxShadow:'0 1px 8px rgba(0,0,0,0.04)',marginBottom:16};

          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <div style={{fontSize:13}}><strong>{occupancy.booked_weeks}</strong> {t.bookedWeeks}</div>
            <div style={{fontSize:13}}><strong>{occupancy.available_weeks}</strong> {t.availableWeeks}</div>
            <div style={{fontSize:13,color:COLORS.muted}}>{t.totalWeeks}: {occupancy.total_weeks}</div>
          </div>
        </div>
      </div>

      <div style={card}>
        <h3 style={head}>{t.bookingsPerUser}</h3>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr>
            <th style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',padding:'8px 10px',textAlign:'left',borderBottom:'1px solid '+COLORS.border}}>{t.userName}</th>
            <th style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',padding:'8px 10px',textAlign:'left',borderBottom:'1px solid '+COLORS.border}}>{t.branchLabel}</th>
            <th style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',padding:'8px 10px',textAlign:'center',borderBottom:'1px solid '+COLORS.border}}>{t.clanName}</th>
            <th style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',padding:'8px 10px',textAlign:'center',borderBottom:'1px solid '+COLORS.border}}>{t.priorityName}</th>
            <th style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',padding:'8px 10px',textAlign:'center',borderBottom:'1px solid '+COLORS.border}}>{t.regularName}</th>
            <th style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',padding:'8px 10px',textAlign:'center',borderBottom:'1px solid '+COLORS.border}}>{t.total}</th>
            <th style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',padding:'8px 10px',textAlign:'left',borderBottom:'1px solid '+COLORS.border}}>{t.lastLogin}</th>
          </tr></thead>
          <tbody>
            {per_user.map(u=><tr key={u.name}>
              <td style={{fontSize:13,padding:'8px 10px',borderBottom:'1px solid #F0EBE5'}}>{u.name}</td>

              <td style={{fontSize:13,padding:'8px 10px',borderBottom:'1px solid #F0EBE5',textAlign:'center',fontWeight:700}}>{u.total}</td>
              <td style={{fontSize:11,padding:'8px 10px',borderBottom:'1px solid #F0EBE5',color:COLORS.muted}}>{u.last_login||'-'}</td>
            </tr>)}
          </tbody>
        </table>
        {per_user.length===0 && <div style={{padding:16,textAlign:'center',color:COLORS.muted,fontSize:13}}>{t.noData}</div>}
      </div>

      <div style={card}>
        <h3 style={head}>{t.bookingsPerBranch}</h3>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {per_branch.map(br=>{const w=maxBranch>0?Math.round(br.count/maxBranch*100):0;
            return <div key={br.name} style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:120,fontSize:12,fontWeight:500,color:COLORS.text,textAlign:'right'}}>{br.name}</div>
              <div style={{flex:1,background:'#F0EBE5',borderRadius:6,height:24,overflow:'hidden'}}><div style={{width:w+'%',height:'100%',background:br.color,borderRadius:6,transition:'width 0.3s',minWidth:br.count>0?20:0}}/></div>
              <div style={{width:30,fontSize:13,fontWeight:600,color:br.color,textAlign:'center'}}>{br.count}</div>

        </div>
      </div>

      <div style={card}>
        <h3 style={head}>{t.bookingTimeline}</h3>
        <div style={{display:'flex',alignItems:'flex-end',gap:4,height:120,padding:'0 4px'}}>

              <div style={{fontSize:10,fontWeight:600,color:COLORS.text}}>{count>0?count:''}</div>
              <div style={{width:'100%',background:count>0?COLORS.success:'#E8DFD5',borderRadius:'4px 4px 0 0',height:Math.max(pctH,4)+'%',transition:'height 0.3s',minHeight:4}}/>
              <div style={{fontSize:9,color:COLORS.muted,marginTop:4}}>{m}</div>
            </div>;})}
        </div>
      </div>
    </div>
  );
}

// LOGIN SCREEN
// ═══════════════════════════════════════════════════════
function LoginScreen({t, lang, onLangToggle, onLogin}){
  const [mode, setMode] = React.useState('login');
  const [email, setEmail] = React.useState('');
  const [selShareholder, setSelShareholder] = React.useState('');
  const [pw, setPw] = React.useState('');
  const [pw2, setPw2] = React.useState('');
  const [error, setError] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [shareholders, setShareholders] = React.useState([]);
  const [notice, setNotice] = React.useState('');
  // Family-member registration: not a shareholder, connected to one.
  const [asFamily, setAsFamily] = React.useState(false);
  const [fullName, setFullName] = React.useState('');
  const [connectedSh, setConnectedSh] = React.useState('');
  // A reset link (…/?reset=TOKEN) opens straight into the new-password form.
  const [resetToken, setResetToken] = React.useState('');

  React.useEffect(()=>{
    api('branches/shareholders').then(d=>setShareholders(d||[])).catch(()=>{});
    try {
      const tok = new URLSearchParams(window.location.search).get('reset');
      if(tok){ setResetToken(tok); setMode('reset'); }
    } catch(e){}
  },[]);

  const available = shareholders.filter(s=>!s.registered);
  const selectedSH = shareholders.find(s=>String(s.id)===selShareholder);
  const selectedBranch = selectedSH ? FAMILY_BRANCHES.find(b=>b.id===selectedSH.branch_id) : null;

  const handleSubmit = async (e)=>{
    e.preventDefault();setError('');setNotice('');setLoading(true);
    try {
      if(mode==='forgot'){
        if(!email.trim()){setError(t.fillAll);setLoading(false);return;}
        await api('auth/request-reset',{method:'POST',body:JSON.stringify({email:email.trim()})});
        setNotice(t.resetPasswordSent);
        setLoading(false);return;
      }
      if(mode==='reset'){
        if(!pw.trim()||!pw2.trim()){setError(t.fillAll);setLoading(false);return;}
        if(pw.length<8){setError(t.passwordMin);setLoading(false);return;}
        if(pw!==pw2){setError(t.passwordMismatch);setLoading(false);return;}
        await api('auth/reset-password',{method:'POST',body:JSON.stringify({token:resetToken,password:pw})});
        setPw('');setPw2('');setResetToken('');
        setMode('login');
        setNotice(t.resetDone);
        try { window.history.replaceState({},'',window.location.pathname); } catch(e2){}
        setLoading(false);return;
      }
      if(mode==='login'){
        if(!email.trim()||!pw.trim()){setError(t.fillAll);setLoading(false);return;}
        const data = await api('auth/login',{method:'POST',body:JSON.stringify({email:email.trim(),password:pw})});
        localStorage.setItem('fargny_token',data.token);
        onLogin(data.user);
      } else if(mode==='register' && asFamily){
        if(!fullName.trim()||!email.trim()||!pw.trim()||!pw2.trim()||!connectedSh){setError(t.fillAll);setLoading(false);return;}
        if(!email.includes('@')){setError(t.invalidEmail);setLoading(false);return;}
        if(pw.length<8){setError(t.passwordMin);setLoading(false);return;}
        if(pw!==pw2){setError(t.passwordMismatch);setLoading(false);return;}
        const data = await api('auth/register',{method:'POST',body:JSON.stringify({
          role:'family_member', display_name:fullName.trim(), email:email.trim(),
          password:pw, connected_shareholder_id:parseInt(connectedSh),
        })});
        localStorage.setItem('fargny_token',data.token);
        onLogin(data.user);
      } else {
        if(!selShareholder||!email.trim()||!pw.trim()||!pw2.trim()){setError(t.fillAll);setLoading(false);return;}
        if(!email.includes('@')){setError(t.invalidEmail);setLoading(false);return;}
        if(pw!==pw2){setError(t.passwordMismatch);setLoading(false);return;}
        const data = await api('auth/register',{method:'POST',body:JSON.stringify({shareholder_id:parseInt(selShareholder),email:email.trim(),password:pw})});
        localStorage.setItem('fargny_token',data.token);
        onLogin(data.user);
      }
    } catch(err){
      setError(err.message);
    }
    setLoading(false);
  };

  const iS={width:'100%',padding:'12px 16px',border:'1px solid '+COLORS.border,borderRadius:8,fontSize:14,fontFamily:"'DM Sans',sans-serif",color:COLORS.text,outline:'none',marginBottom:12,boxSizing:'border-box'};

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:COLORS.bg,fontFamily:"'DM Sans',sans-serif",padding:20}}>
      <div style={{background:COLORS.white,borderRadius:16,padding:'48px 40px',maxWidth:420,width:'100%',boxShadow:'0 4px 24px rgba(44,24,16,0.08)',position:'relative'}}>
        <button onClick={onLangToggle} style={{position:'absolute',top:16,right:16,background:'none',border:'1px solid '+COLORS.border,borderRadius:8,padding:'4px 12px',cursor:'pointer',fontSize:13,color:COLORS.muted,fontFamily:"'DM Sans',sans-serif"}}>{lang==='en'?'NL':'EN'}</button>
        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:32,fontWeight:700,color:COLORS.text,margin:'0 0 4px 0',textAlign:'center'}}>{t.appName}</h1>
        <p style={{fontSize:14,color:COLORS.muted,margin:'0 0 32px 0',textAlign:'center'}}>{t.subtitle}</p>
        <div style={{display:'flex',gap:0,marginBottom:24,borderBottom:'2px solid '+COLORS.border}}>
          {['login','register'].map(m=><button key={m} onClick={()=>{setMode(m);setError('');}} style={{flex:1,padding:'10px 16px',background:'none',border:'none',borderBottom:'2px solid '+(mode===m?COLORS.accent:'transparent'),marginBottom:-2,cursor:'pointer',fontSize:14,fontWeight:600,color:mode===m?COLORS.text:COLORS.muted,fontFamily:"'DM Sans',sans-serif"}}>{m==='login'?t.signIn:t.register}</button>)}
        </div>
        <form onSubmit={handleSubmit}>
          {error && <div style={{background:'#FEF2F2',color:COLORS.danger,padding:'10px 14px',borderRadius:8,fontSize:13,marginBottom:12}}>{error}</div>}
          {notice && <div style={{background:'#ECFDF5',color:COLORS.success,padding:'10px 14px',borderRadius:8,fontSize:13,marginBottom:12}}>{notice}</div>}
          {mode==='login' && <>
            <input style={iS} type="email" placeholder={t.email} value={email} onChange={e=>setEmail(e.target.value)}/>
            <input style={iS} type="password" placeholder={t.password} value={pw} onChange={e=>setPw(e.target.value)}/>
            <div style={{textAlign:'right',marginTop:-4,marginBottom:8}}>
              <button type="button" onClick={()=>{setMode('forgot');setError('');}} style={{background:'none',border:'none',color:COLORS.accent,fontSize:12,cursor:'pointer',padding:0,fontFamily:"'DM Sans',sans-serif"}}>{t.forgotPassword}</button>
            </div>
          </>}
          {mode==='forgot' && <>
            <p style={{fontSize:13,color:COLORS.text,margin:'0 0 12px 0'}}>{t.resetIntro}</p>
            <input style={iS} type="email" placeholder={t.email} value={email} onChange={e=>setEmail(e.target.value)}/>
          </>}
          {mode==='reset' && <>
            <p style={{fontSize:13,color:COLORS.text,margin:'0 0 12px 0'}}>{t.setNewPassword}</p>
            <input style={iS} type="password" placeholder={t.newPassword} value={pw} onChange={e=>setPw(e.target.value)}/>
            <input style={iS} type="password" placeholder={t.confirmPassword} value={pw2} onChange={e=>setPw2(e.target.value)}/>
          </>}
          {mode==='register' && !asFamily && <>
            <select style={iS} value={selShareholder} onChange={e=>setSelShareholder(e.target.value)}>
              <option value="">{t.pickShareholder}</option>
              {available.map(s=><option key={s.id} value={s.id}>{s.full_name} ({s.branch_name})</option>)}
            </select>
            <div style={{fontSize:11,color:COLORS.muted,marginTop:-8,marginBottom:12,fontStyle:'italic'}}>{t.dropdownNote}</div>
            {selectedBranch && <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:selectedBranch.color+'10',borderRadius:8,marginBottom:12,fontSize:13}}><div style={{width:10,height:10,borderRadius:3,background:selectedBranch.color}}/>{selectedBranch.name}</div>}
            <input style={iS} type="email" placeholder={t.email} value={email} onChange={e=>setEmail(e.target.value)}/>
            <input style={iS} type="password" placeholder={t.password} value={pw} onChange={e=>setPw(e.target.value)}/>
            <input style={iS} type="password" placeholder={t.confirmPassword} value={pw2} onChange={e=>setPw2(e.target.value)}/>
            <div style={{textAlign:'center',marginTop:4}}>
              <button type="button" onClick={()=>{setAsFamily(true);setError('');}} style={{background:'none',border:'none',color:COLORS.accent,fontSize:12,cursor:'pointer',padding:0,fontFamily:"'DM Sans',sans-serif",textDecoration:'underline'}}>{t.notShareholder}</button>
            </div>
          </>}
          {mode==='register' && asFamily && <>
            <div style={{display:'inline-block',fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:10,background:COLORS.board+'18',color:COLORS.board,marginBottom:12}}>{'\u{1F46A}'} {t.familyMember}</div>
            <input style={iS} type="text" placeholder={t.fullNameLabel} value={fullName} onChange={e=>setFullName(e.target.value)}/>
            <select style={iS} value={connectedSh} onChange={e=>setConnectedSh(e.target.value)}>
              <option value="">{t.pickConnected}</option>
              {shareholders.map(s=><option key={s.id} value={s.id}>{s.full_name} ({s.branch_name})</option>)}
            </select>
            <div style={{fontSize:11,color:COLORS.muted,marginTop:-8,marginBottom:12,fontStyle:'italic'}}>{t.connectedToWho}</div>
            <input style={iS} type="email" placeholder={t.email} value={email} onChange={e=>setEmail(e.target.value)}/>
            <input style={iS} type="password" placeholder={t.password} value={pw} onChange={e=>setPw(e.target.value)}/>
            <input style={iS} type="password" placeholder={t.confirmPassword} value={pw2} onChange={e=>setPw2(e.target.value)}/>
            <div style={{textAlign:'center',marginTop:4}}>
              <button type="button" onClick={()=>{setAsFamily(false);setError('');}} style={{background:'none',border:'none',color:COLORS.muted,fontSize:12,cursor:'pointer',padding:0,fontFamily:"'DM Sans',sans-serif",textDecoration:'underline'}}>{t.backToShareholder}</button>
            </div>
          </>}
          <button type="submit" disabled={loading} style={{width:'100%',padding:'14px 0',background:loading?'#D4C5B5':COLORS.accent,border:'none',borderRadius:10,fontSize:15,fontWeight:700,color:COLORS.white,cursor:loading?'default':'pointer',fontFamily:"'DM Sans',sans-serif",marginTop:8}}>{loading?t.loading:mode==='login'?t.signIn:mode==='forgot'?t.sendResetLink:mode==='reset'?t.setNewPassword:t.createAccount}</button>
          {(mode==='forgot'||mode==='reset') && <>
            <button type="button" onClick={()=>{setMode('login');setError('');setNotice('');setResetToken('');setPw('');setPw2('');}} style={{width:'100%',padding:'10px 0',marginTop:10,background:'none',border:'1px solid '+COLORS.border,borderRadius:10,fontSize:13,color:COLORS.muted,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.backToLogin}</button>
            <a href="https://wa.me/4915788611151" target="_blank" rel="noopener noreferrer" style={{display:'block',textAlign:'center',marginTop:10,fontSize:12,color:COLORS.muted}}>{t.stillStuck}</a>
          </>}
        </form>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// ADMIN TAB VIEW (pending cancellations + user management)
// ═══════════════════════════════════════════════════════
function AdminTab({bookings=[], weeks=[], registeredUsers=[], user, year, onApproveCancellation, onRejectCancellation, onToggleAdmin, onSetRole, onEditBooking, onDeleteBooking, onOpenProfile, t, lang}){
  const pending = bookings.filter(b=>b.cancellation_status==='pending');
  const [roleFilter, setRoleFilter] = React.useState('all');
  const roleOf = u => u.role || (u.is_admin?'admin':'shareholder');
  const roleLabel = r => r==='admin'?t.roleAdmin:r==='family_member'?t.roleFamily:t.roleShareholder;
  const roleColor = r => r==='admin'?COLORS.accent:r==='family_member'?COLORS.board:COLORS.success;
  const filteredUsers = registeredUsers.filter(u=>{
    if(roleFilter==='all') return true;
    return roleOf(u)===roleFilter;
  });
  const cardStyle = {background:COLORS.white,borderRadius:14,padding:20,boxShadow:'0 1px 8px rgba(0,0,0,0.04)',marginBottom:20};

  const downloadCsv = ()=>{
    const esc = v => {
      if(v===null||v===undefined) return '';
      const s = String(v).replace(/"/g,'""');
      return /[",\n;]/.test(s) ? '"'+s+'"' : s;
    };
    const rows = [['id','year','week_id','week_num','week_start','week_end','phase','user_id','user_name','user_email','branch','check_in','check_out','open_to_share','remarks','cancellation_status','payment_status','include_cleaning','admin_booked','booked_at']];
    bookings.forEach(b=>{
      const w = weeks.find(wk=>wk.id===b.week_id);
      rows.push([b.id,b.year,b.week_id,w?w.weekNum:'',w?w.start:'',w?w.end:'',b.phase,b.user_id,b.user_name,b.user_email,b.branch_name,b.check_in_date||'',b.check_out_date||'',b.open_to_share?1:0,b.remarks||'',b.cancellation_status,b.payment_status,b.include_cleaning?1:0,b.admin_booked?1:0,b.booked_at]);
    });
    const csv = rows.map(r=>r.map(esc).join(',')).join('\n');
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `fargny-bookings-${year}-${toISO(new Date())}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  };

  return (
    <div style={{padding:'24px 20px',maxWidth:900,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,flexWrap:'wrap',marginBottom:20}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:700,color:COLORS.text,margin:'0 0 6px 0',fontFamily:"'Playfair Display',Georgia,serif"}}>{'\u{1F511}'} {t.adminTitle}</h2>
          <p style={{fontSize:13,color:COLORS.muted,margin:0}}>{t.adminDesc}</p>
        </div>
        <button onClick={downloadCsv} style={{padding:'10px 16px',background:COLORS.accent,border:'none',borderRadius:10,fontSize:13,fontWeight:600,color:'white',cursor:'pointer',fontFamily:"'DM Sans',sans-serif",display:'flex',alignItems:'center',gap:8}}>{'\u2B07\uFE0F'} {t.downloadData}</button>
      </div>

      {/* Pending cancellations */}
      <div style={cardStyle}>
        <h3 style={{fontSize:16,fontWeight:700,color:COLORS.text,margin:'0 0 14px 0'}}>{'\u274C'} {t.pendingCancellations}</h3>
        {pending.length===0
          ? <div style={{padding:16,textAlign:'center',color:COLORS.muted,fontSize:14}}>{t.noPendingCancellations}</div>
          : <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {pending.map(b=>{const w=weeks.find(wk=>wk.id===b.week_id);const br=FAMILY_BRANCHES.find(x=>x.id===b.branch_id);
                return <div key={b.id} style={{padding:'14px 16px',background:'#FEF2F2',border:'1px solid #B8504230',borderRadius:10,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                  <div style={{flex:1,minWidth:180}}>
                    <div style={{fontSize:14,fontWeight:600,color:COLORS.text}}>{b.user_name}</div>
                    <div style={{fontSize:12,color:COLORS.muted,marginTop:2}}>{br?br.name:''} &middot; {w?'W'+w.weekNum+': '+formatDate(w.start,lang)+' \u2013 '+formatDate(w.end,lang):b.week_id}</div>
                  </div>
                  <button onClick={()=>onApproveCancellation(b.id)} style={{padding:'6px 14px',background:COLORS.success,border:'none',borderRadius:8,fontSize:12,color:'white',cursor:'pointer',fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>{t.approveCancellation}</button>
                  <button onClick={()=>onRejectCancellation(b.id)} style={{padding:'6px 14px',background:'transparent',border:'1.5px solid #D4C5B5',borderRadius:8,fontSize:12,color:COLORS.muted,cursor:'pointer',fontWeight:500,fontFamily:"'DM Sans',sans-serif"}}>{t.rejectCancellation}</button>
                </div>;
              })}
            </div>
        }
      </div>

      {/* Booking management */}
      <div style={cardStyle}>
        <h3 style={{fontSize:16,fontWeight:700,color:COLORS.text,margin:'0 0 14px 0'}}>{'\u{1F4C5}'} {t.bookingsTab}</h3>
        <BookingManager bookings={bookings} weeks={weeks} onEditBooking={onEditBooking} onDeleteBooking={onDeleteBooking} t={t} lang={lang}/>
      </div>

      {/* User management */}
      <div style={cardStyle}>
        <h3 style={{fontSize:16,fontWeight:700,color:COLORS.text,margin:'0 0 14px 0'}}>{'\u{1F465}'} {t.userManagement}</h3>
        <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
          {[['all',t.filterAll],['admin',t.filterAdmins],['shareholder',t.filterShareholders],['family_member',t.filterFamily]].map(([k,label])=>
            <button key={k} onClick={()=>setRoleFilter(k)} style={{padding:'6px 12px',borderRadius:8,border:'none',background:roleFilter===k?COLORS.text:'#E8DFD5',color:roleFilter===k?COLORS.white:COLORS.muted,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{label}</button>)}
        </div>
        {filteredUsers.length===0
          ? <div style={{padding:16,textAlign:'center',color:COLORS.muted,fontSize:14}}>{t.noData}</div>
          : <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {filteredUsers.map(u=>{const br=FAMILY_BRANCHES.find(x=>x.id===u.branch_id);const isSelf=u.id===user.id;const r=roleOf(u);
                return <div key={u.id} style={{padding:'10px 14px',background:'#F8F5F2',borderRadius:10,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',borderLeft:'3px solid '+(br?br.color:'#ccc')}}>
                  <div style={{flex:1,minWidth:170}}>
                    <div style={{fontSize:13,fontWeight:600,color:COLORS.text,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                      <MemberLink user={{user_id:u.id,display_name:u.display_name,branch_id:u.branch_id,photo_url:u.photo_url}} onOpen={onOpenProfile} size={22} color={COLORS.text}/>
                      <span style={{fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:8,background:roleColor(r)+'18',color:roleColor(r)}}>{roleLabel(r)}</span>
                    </div>
                    <div style={{fontSize:11,color:COLORS.muted}}>{u.email} &middot; {br?br.name:'—'}
                      {r==='family_member' && u.connected_shareholder_name ? ' \u00B7 '+t.connectedTo+': '+u.connected_shareholder_name : ''}
                    </div>
                  </div>
                  {onSetRole && <select value={r} disabled={isSelf} onChange={e=>onSetRole(u, e.target.value)} title={t.changeRole} style={{padding:'5px 8px',border:'1px solid '+COLORS.border,borderRadius:8,fontSize:11,background:'white',fontFamily:"'DM Sans',sans-serif",cursor:isSelf?'not-allowed':'pointer',opacity:isSelf?0.4:1}}>
                    <option value="admin">{t.roleAdmin}</option>
                    <option value="shareholder">{t.roleShareholder}</option>
                    <option value="family_member">{t.roleFamily}</option>
                  </select>}
                  <button onClick={()=>onToggleAdmin(u)} disabled={isSelf} style={{padding:'6px 12px',background:u.is_admin?'transparent':COLORS.accent,border:u.is_admin?'1.5px solid #D4C5B5':'none',borderRadius:8,fontSize:11,color:u.is_admin?COLORS.muted:'white',cursor:isSelf?'not-allowed':'pointer',fontWeight:600,fontFamily:"'DM Sans',sans-serif",opacity:isSelf?0.4:1}}>
                    {u.is_admin?t.removeAdmin:t.makeAdmin}
                  </button>
                </div>;
              })}
            </div>
        }
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// APP (main component)
// ═══════════════════════════════════════════════════════
function App(){
  const [lang, setLang] = React.useState(()=>localStorage.getItem('fargny_lang')||'en');
  const [user, setUser] = React.useState(null);
  const [view, setView] = React.useState('book');
  const [year, setYear] = React.useState(2026);
  const [phase, setPhase] = React.useState('regular');
  const [bookings, setBookings] = React.useState([]);
  const [myBookings, setMyBookings] = React.useState([]);
  const [weeks, setWeeks] = React.useState([]);
  const [filterMonth, setFilterMonth] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const [selectedBranch, setSelectedBranch] = React.useState(null);
  const [showAdmin, setShowAdmin] = React.useState(false);
  const [phaseConfig, setPhaseConfig] = React.useState(null);
  const [boardEvents, setBoardEvents] = React.useState([]);
  const [branchData, setBranchData] = React.useState([]);
  const [registeredUsers, setRegisteredUsers] = React.useState([]);
  const [adminUsers, setAdminUsers] = React.useState([]);
  // {userId, self} while a profile card is open.
  const [profileCard, setProfileCard] = React.useState(null);
  // Own photo, for the header avatar. Absent until a profile is filled in.
  const [myPhotoUrl, setMyPhotoUrl] = React.useState(null);
  const [shareDefault, setShareDefault] = React.useState(false);
  React.useEffect(()=>{
    api('profile/me').then(p=>{
      if(!p) return;
      setMyPhotoUrl(p.photo_url);
      setShareDefault(!!p.open_to_share_default);
    }).catch(()=>{});
  },[]);
  const openProfile = React.useCallback((userId, isSelf)=>{
    if(!userId) return;
    setProfileCard({userId, self: !!isSelf || userId===user.id});
  },[user.id]);
  const [calendarData, setCalendarData] = React.useState({bookings:[],clanRevealed:true,priorityRevealed:true});
  const [gcalEvents, setGcalEvents] = React.useState([]);
  const [gcalLoading, setGcalLoading] = React.useState(true);
  const [authChecked, setAuthChecked] = React.useState(false);
  // Calendar view month/year persists across tab switches (reset only on full reload/login).
  const [calMonth, setCalMonth] = React.useState(()=>new Date().getMonth());
  const [calYear, setCalYear] = React.useState(()=>2026);
  // When clicking a date in the calendar we hand the target ISO date to BookingView
  // so it can scroll to and highlight that week.
  const [pendingBookDate, setPendingBookDate] = React.useState(null);

  const t = T[lang]||T.en;
  const showToast = (msg)=>{setToast(msg);setTimeout(()=>setToast(null),3500);};
  const toggleLang = ()=>{const next=lang==='en'?'nl':'en';setLang(next);localStorage.setItem('fargny_lang',next);};

  // Check auth on mount
  React.useEffect(()=>{
    const token = localStorage.getItem('fargny_token');
    if(!token){setAuthChecked(true);return;}
    api('auth/me').then(d=>{setUser(d.user);setAuthChecked(true);}).catch(()=>{localStorage.removeItem('fargny_token');setAuthChecked(true);});
  },[]);

  // Load data when user logs in or year changes
  React.useEffect(()=>{
    if(!user) return;
    const load = async ()=>{
      // Load each independently so one failure doesn't wipe out the others.
      // Also ALWAYS set weeks — fall back to client-side generation if API fails.
      setWeeks(generateWeeks(year));
      try {
        const bkData = await api(`bookings?year=${year}`);
        console.log('[Fargny] bookings response:', bkData);
        setBookings(bkData.bookings||[]);
        setMyBookings(bkData.my_bookings||[]);
        if(Array.isArray(bkData.weeks) && bkData.weeks.length>0) setWeeks(bkData.weeks);
      } catch(e){console.error('[Fargny] bookings load failed',e);}
      try { const pcData = await api(`phase-config?year=${year}`); setPhaseConfig(pcData); }
      catch(e){console.error('[Fargny] phase-config load failed',e);}
      try { const beData = await api('board-events'); setBoardEvents(beData||[]); }
      catch(e){console.error('[Fargny] board-events load failed',e);}
      if(user.is_admin){
        try { const uData = await api('users'); setAdminUsers(uData||[]); }
        catch(e){console.error('[Fargny] users load failed',e);}
      }
      try {
        const brData = await api('branches');
        setBranchData(brData||[]);
        const users = [];
        (brData||[]).forEach(br=>(br.members||[]).forEach(m=>{m.branch_id=br.id;users.push(m);}));
        setRegisteredUsers(users);
      } catch(e){console.error('[Fargny] branches load failed',e);}
      // Fetch Google Calendar events up-front so the Booking tab can block
      // weeks that are already occupied in the legacy calendar from the very
      // first render. Cached 15 min server-side, so this is cheap on reload.
      setGcalLoading(true);
      try {
        const gcData = await api(`google-calendar?year=${year}`);
        setGcalEvents((gcData&&gcData.events)||[]);
      } catch(e){console.error('[Fargny] gcal load failed',e);setGcalEvents([]);}
      finally { setGcalLoading(false); }
    };
    load();
  },[user,year]);

  // Calendar-tab-only data (reveal-aware booking list). Gcal is fetched in the
  // effect above so the Booking tab already has it.
  React.useEffect(()=>{
    if(!user || view!=='calendar') return;
    api(`bookings/calendar?year=${year}`).then(d=>setCalendarData(d)).catch(()=>{});
  },[user,year,view]);

  const refreshData = async ()=>{
    try {
      const bkData = await api(`bookings?year=${year}`);
      setBookings(bkData.bookings||[]);
      setMyBookings(bkData.my_bookings||[]);
      setWeeks(bkData.weeks||generateWeeks(year));
      const beData = await api('board-events');
      setBoardEvents(beData||[]);
      if(user && user.is_admin){
        try { const uData = await api('users'); setAdminUsers(uData||[]); } catch(e2){}
      }
    } catch(e){}
  };

  const handleLogin = (userData)=>{setUser(userData);};
  const handleLogout = async ()=>{
    try{await api('auth/logout',{method:'POST'});}catch(e){}
    localStorage.removeItem('fargny_token');
    setUser(null);setBookings([]);setMyBookings([]);
  };

  const handleBook = async (week, bookingPhase, opts={})=>{
    try {
      await api('bookings',{method:'POST',body:JSON.stringify({
        week_id:week.id, year, phase:bookingPhase,
        open_to_share:opts.open_to_share||false,
        remarks:opts.remark||'',
        linked_user_ids:opts.linked_members||[],
        check_in_date:opts.custom_start||null,
        check_out_date:opts.custom_end||null,
      })});
      showToast(t.bookingConfirmed);
      await refreshData();
    } catch(e){showToast(e.message);}
  };

  const handleRequestCancel = async (booking)=>{
    try {
      await api(`bookings/${booking.id}`,{method:'DELETE'});
      showToast(t.cancelRequested);
      await refreshData();
    } catch(e){showToast(e.message);}
  };

  const handleAdminEditBooking = async (booking, changes)=>{
    try{
      await api(`bookings/${booking.id}`,{method:'PUT',body:JSON.stringify(changes)});
      showToast('\u270F\uFE0F '+t.bookingUpdated);
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleAdminDeleteBooking = async (booking, note)=>{
    try{
      await api(`admin/delete-booking/${booking.id}`,{method:'POST',body:JSON.stringify({admin_note:note||''})});
      showToast('\u{1F5D1} '+t.bookingDeleted);
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleJoinBooking = async (booking, leaving)=>{
    try{
      await api(`bookings/${booking.id}/join`,{method:leaving?'DELETE':'POST'});
      showToast(leaving?('\u2715 '+t.leftBooking):('\u{1F91D} '+t.joinedBooking));
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleToggleShare = async (booking)=>{
    try {
      await api(`bookings/${booking.id}`,{method:'PUT',body:JSON.stringify({open_to_share:!booking.open_to_share})});
      showToast('\u{1F91D} '+t.sharedUpdated);
      await refreshData();
    } catch(e){showToast(e.message);}
  };

  const handleApproveCancellation = async (id)=>{
    try{await api(`admin/approve-cancellation/${id}`,{method:'POST'});showToast(t.approveCancellation);await refreshData();}catch(e){showToast(e.message);}
  };
  const handleRejectCancellation = async (id)=>{
    try{await api(`admin/reject-cancellation/${id}`,{method:'POST'});showToast(t.rejectCancellation);await refreshData();}catch(e){showToast(e.message);}
  };
  const handleUpdatePayment = async (id,status)=>{
    try{await api(`admin/update-payment-status/${id}`,{method:'POST',body:JSON.stringify({status})});await refreshData();}catch(e){showToast(e.message);}
  };
  const handleSetRole = async (u, role)=>{
    try{
      await api(`users/${u.id}/role`,{method:'POST',body:JSON.stringify({role})});
      showToast(t.roleUpdated+': '+u.display_name);
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleToggleAdmin = async (u)=>{
    try{
      await api(`users/${u.id}/toggle-admin`,{method:'POST'});
      showToast((u.is_admin?t.removeAdmin:t.makeAdmin)+': '+u.display_name);
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleSaveGuests = async (id, guests, includeCleaning=true)=>{
    try{
      const guestData = [];
      for(let n=0;n<7;n++){guestData.push({child04:guests.child04[n]||0,child59:guests.child59[n]||0,adult:guests.adult[n]||0});}
      await api(`payments/${id}`,{method:'POST',body:JSON.stringify({guest_data:guestData,include_cleaning:includeCleaning})});
      showToast('\u2705 '+t.saveCosts);
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleAdminBook = async (weekId, targetUser, bookingPhase)=>{
    try{
      await api('admin/book',{method:'POST',body:JSON.stringify({user_id:targetUser.id,week_id:weekId,year,phase:bookingPhase})});
      showToast(t.booked+': '+targetUser.display_name);
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleCreateBoardEvent = async (ev)=>{
    try{
      await api('board-events',{method:'POST',body:JSON.stringify(ev)});
      showToast('\u{1F451} '+ev.name);
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleSignUpBoard = async (evId)=>{
    try{
      await api(`board-events/${evId}/signup`,{method:'POST'});
      showToast('\u2705 '+t.signedUp);
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleUpdateBoardEvent = async (id, ev)=>{
    try{
      await api(`board-events/${id}`,{method:'PUT',body:JSON.stringify(ev)});
      showToast('✏️ '+t.eventUpdated);
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleDeleteBoardEvent = async (ev)=>{
    if(!window.confirm(t.confirmCancelEvent)) return;
    try{
      await api(`board-events/${ev.id}`,{method:'DELETE'});
      showToast('✕ '+t.eventCancelled);
      await refreshData();
    }catch(e){showToast(e.message);}
  };
  const handleUnsignUpBoard = async (evId)=>{
    try{
      await api(`board-events/${evId}/signup`,{method:'DELETE'});
      showToast('\u2715 '+t.cancelSignup);
      await refreshData();
    }catch(e){showToast(e.message);}
  };

  if(!authChecked) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:COLORS.bg,fontFamily:"'DM Sans',sans-serif"}}><div style={{fontSize:16,color:COLORS.muted}}>{t.loading}</div></div>;
  if(!user) return <LoginScreen t={t} lang={lang} onLangToggle={toggleLang} onLogin={handleLogin}/>;

  // Prefer live branch list from the API so renames/new branches show
  // up without a redeploy. Fall back to the hardcoded list only if the
  // API hasn't returned yet.
  const userBranch = (branchData && branchData.find(b=>b.id===user.branch_id))
                     || FAMILY_BRANCHES.find(b=>b.id===user.branch_id)
                     || {name:'—',color:COLORS.muted};
  const isFamily = (user.role==='family_member');
  const totalBooked = bookings.filter(b=>b.cancellation_status!=='approved').length;
  const pendingCount = bookings.filter(b=>b.cancellation_status==='pending').length;
  const navItems = [{id:'book',label:t.book,emoji:'\u{1F4DD}'},{id:'calendar',label:t.calendar,emoji:'\u{1F4C5}'},{id:'family',label:t.family,emoji:'\u{1F465}'},{id:'feedback',label:t.feedback,emoji:'\u{1F4CB}'}];
  if(user.is_admin) navItems.push({id:'statistics',label:t.statistics,emoji:'\u{1F4CA}'});
  if(user.is_admin) navItems.push({id:'admin',label:t.adminTab,emoji:'\u{1F511}'});
  const branchMembers = selectedBranch ? (branchData.find(b=>b.id===selectedBranch.id)||{}).members||[] : [];

  return (
    <div style={{minHeight:'100vh',background:COLORS.bg,fontFamily:"'DM Sans','Segoe UI',sans-serif"}}>
      {view==='family' && <FamilyView user={user} onOpenProfile={openProfile} showToast={showToast} t={t} lang={lang}/>}
      {profileCard && <ProfileCard userId={profileCard.userId} self={profileCard.self} onClose={()=>setProfileCard(null)} showToast={showToast} t={t} lang={lang}/>}
      {selectedBranch && <BranchMembersPanel branch={selectedBranch} onClose={()=>setSelectedBranch(null)} t={t} members={branchMembers} onOpenProfile={openProfile}/>}
      {showAdmin && <AdminPanel registeredUsers={registeredUsers} weeks={weeks} year={year} bookings={bookings} onBooked={handleAdminBook} onApproveCancellation={handleApproveCancellation} onRejectCancellation={handleRejectCancellation} onUpdatePayment={handleUpdatePayment} onCreateBoardEvent={handleCreateBoardEvent} onEditBooking={handleAdminEditBooking} onDeleteBooking={handleAdminDeleteBooking} onClose={()=>setShowAdmin(false)} t={t} lang={lang}/>}
      <Toast message={toast}/>

      {/* NAVBAR */}
      <div className="fargny-header" style={{background:COLORS.white,borderBottom:'1px solid '+COLORS.border,padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:100,flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:22}}>{'\u{1F3E1}'}</span>
          <div><h1 style={{fontSize:18,fontWeight:700,color:COLORS.text,margin:0,fontFamily:"'Playfair Display',Georgia,serif"}}>Fargny</h1>
            <p style={{fontSize:11,color:COLORS.muted,margin:0}}>{year}{pendingCount>0?' \u00B7 '+pendingCount+' pending':''}</p></div>
        </div>
        <div className="fargny-tabs" style={{display:'flex',gap:0,background:COLORS.bg,borderRadius:10,padding:3}}>
          {navItems.map(v=><button key={v.id} onClick={()=>setView(v.id)} style={{padding:'7px 16px',border:'none',borderRadius:8,background:view===v.id?COLORS.white:'transparent',color:view===v.id?COLORS.text:COLORS.muted,fontWeight:view===v.id?600:400,cursor:'pointer',fontSize:13,fontFamily:"'DM Sans',sans-serif",boxShadow:view===v.id?'0 1px 4px rgba(0,0,0,0.08)':'none'}}>{v.emoji} {v.label}</button>)}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={toggleLang} style={{padding:'6px 12px',border:'1.5px solid '+COLORS.border,borderRadius:8,background:COLORS.white,fontSize:12,fontWeight:600,color:COLORS.muted,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{lang==='en'?'\u{1F1F3}\u{1F1F1} NL':'\u{1F1EC}\u{1F1E7} EN'}</button>
          <div onClick={()=>setView('family')} title={t.myProfile}
            style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:13,fontWeight:600,color:COLORS.text,display:'flex',alignItems:'center',gap:6,justifyContent:'flex-end'}}>
                {user.display_name}
                {isFamily && <span style={{fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:8,background:COLORS.board+'18',color:COLORS.board,whiteSpace:'nowrap'}}>{t.familyMember}</span>}
              </div>
              <div style={{fontSize:11,color:userBranch.color,fontWeight:600}}>{userBranch.name}</div>
            </div>
            <Avatar user={{display_name:user.display_name,branch_id:user.branch_id,photo_url:myPhotoUrl}} size={34}/>
          </div>
          <button onClick={handleLogout} style={{padding:'7px 14px',background:'transparent',border:'1.5px solid #D4C5B5',borderRadius:8,fontSize:12,color:COLORS.muted,cursor:'pointer',fontWeight:500,fontFamily:"'DM Sans',sans-serif"}}>{t.signOut}</button>
        </div>
      </div>

      {view==='book' && <BookingView user={user} bookings={bookings} myBookings={myBookings} weeks={weeks} year={year} setYear={y=>{setYear(y);setFilterMonth(null);}} phase={phase} setPhase={setPhase} phaseConfig={phaseConfig} filterMonth={filterMonth} setFilterMonth={setFilterMonth} onSelectBranch={setSelectedBranch} onShowAdmin={()=>setShowAdmin(true)} onBook={handleBook} onRequestCancel={handleRequestCancel} onToggleShare={handleToggleShare} onJoinBooking={handleJoinBooking} onOpenProfile={openProfile} shareDefault={shareDefault} isFamily={isFamily} onSaveGuests={handleSaveGuests} boardEvents={boardEvents} gcalEvents={gcalEvents} gcalLoading={gcalLoading} onSignUpBoard={handleSignUpBoard} onUnsignUpBoard={handleUnsignUpBoard} onDeleteEvent={handleDeleteBoardEvent} onUpdateEvent={handleUpdateBoardEvent} onCreateEvent={handleCreateBoardEvent} registeredUsers={registeredUsers} branchData={branchData} showToast={showToast} t={t} lang={lang} pendingBookDate={pendingBookDate} clearPendingBookDate={()=>setPendingBookDate(null)}/>}
      {view==='calendar' && <CalendarView bookings={(calendarData.bookings&&calendarData.bookings.length)?calendarData.bookings:bookings} weeks={calendarData.weeks||weeks} year={year} boardEvents={boardEvents} gcalEvents={gcalEvents} clanRevealed={calendarData.clan_revealed!==false} priorityRevealed={calendarData.priority_revealed!==false} registeredUsers={registeredUsers} user={user} t={t} lang={lang} calMonth={calMonth} setCalMonth={setCalMonth} calYear={calYear} setCalYear={setCalYear} onPickDate={(ds)=>{setPendingBookDate(ds);setPhase('regular');setView('book');}} onOpenProfile={openProfile}/>}
      {view==='feedback' && <FeedbackView t={t} lang={lang}/>}
      {view==='statistics' && user.is_admin && <StatisticsView user={user} year={year} t={t} lang={lang}/>}
      {view==='admin' && user.is_admin && <AdminTab bookings={bookings} weeks={weeks} registeredUsers={adminUsers.length?adminUsers:registeredUsers} user={user} year={year} onApproveCancellation={handleApproveCancellation} onRejectCancellation={handleRejectCancellation} onToggleAdmin={handleToggleAdmin} onSetRole={handleSetRole} onEditBooking={handleAdminEditBooking} onDeleteBooking={handleAdminDeleteBooking} onOpenProfile={openProfile} t={t} lang={lang}/>}
      <WhatsAppButton t={t}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('fargny-booking-root')).render(<App/>);
</script>
</body>
</html>
