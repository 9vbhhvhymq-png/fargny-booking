// API CLIENT

// Resolve API path relative to where this page is served from,
// so it works at /booking/api/ or any other sub-path.
const _pageBase = new URL('.', window.location.href).href.replace(/\/$/, '');
const API_BASE = _pageBase + '/api';

// Multipart upload. Deliberately does not set Content-Type: the browser
// has to add its own multipart boundary.
async function apiUpload(path, formData) {
  const token = localStorage.getItem('fargny_token');
  const headers = {};
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}/${path}`, { method: 'POST', headers, body: formData });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; }
  catch (e) {
    console.error('[Fargny] Invalid JSON from', path, '->', text.slice(0, 500));
    throw new Error('Server returned invalid response (HTTP ' + res.status + ')');
  }
  if (!data || !data.success) throw new Error((data && data.error) || 'Upload failed');
  return data.data;
}

async function api(path, options = {}) {
  const token = localStorage.getItem('fargny_token');
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}/${path}`, { ...options, headers });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; }
  catch (e) {
    console.error('[Fargny] Invalid JSON from', path, '->', text.slice(0, 500));
    throw new Error('Server returned invalid response (HTTP ' + res.status + ')');
  }
  if (!data) {
    if (!res.ok) throw new Error('Server error (HTTP ' + res.status + ')');
    return null;
  }
  if (!data.success) throw new Error(data.error || 'API error');
  return data.data;
}

const MONTHS_SHORT = {
  en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  nl: ['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'],
};

  en: ['January','February','March','April','May','June','July','August','September','October','November','December'],

// ═══════════════════════════════════════════════════════
// UTILITY FUNCTIONS
// ═══════════════════════════════════════════════════════
function toISO(date) {
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function parseISO(s) { const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
// Weeks run Friday to Friday: arrive Friday, depart the next Friday.
// 5 = Friday for Date.getDay() (0 = Sunday). Mirrors WEEK_START_DOW in PHP.
const WEEK_START_DOW = 5;
// A week is 7 nights: arrive on its start day, depart a week later. week.end
// is the last night, so the departure date shown to members is end + 1 day.
function weekDeparture(week){ if(!week) return ''; const d=parseISO(week.end); d.setDate(d.getDate()+1); return toISO(d); }

// ---- "Via old calendar" -------------------------------------------------
// A stay counts as an old-calendar booking only when it was NOT created in
// the booking tool. Many stays also still sit in the shared Google Calendar
// after being booked here; those are app bookings and must not be labelled
// legacy. The tool never lets two different stays share a night, so a
// Google Calendar entry overlapping an app booking is that same stay.
function gcalNightRange(ev){
  const s = ev && ev.start_date ? ev.start_date : ''; if(!s) return null;
  const raw = ev.end_date || s;
  if(raw > s) return [s, raw];
  const d = parseISO(s); d.setDate(d.getDate()+1); return [s, toISO(d)];
}
function bookingNightRanges(bookings, weekFor){
  const out = [];
  (bookings||[]).forEach(b=>{
    if(b.cancellation_status==='approved') return;
    let s = b.check_in_date, e = b.check_out_date;
    if(!s || !e){
      const w = weekFor ? weekFor(b) : null;
      if(w){ if(!s) s = w.start; if(!e) e = weekDeparture(w); }
    }
    if(s && e) out.push([s,e]);
  });
  return out;
}
function isLegacyGcal(ev, ranges){
  const r = gcalNightRange(ev); if(!r) return false;
  return !(ranges||[]).some(([s,e]) => r[0] < e && s < r[1]);
}
function legacyGcalOnly(gcalEvents, bookings, weekFor){
  const ranges = bookingNightRanges(bookings, weekFor);
  return (gcalEvents||[]).filter(ev=>isLegacyGcal(ev, ranges));
}
function generateWeeks(year) {
  const weeks=[]; let d=new Date(year,0,1);
  while(d.getDay()!==WEEK_START_DOW) d.setDate(d.getDate()+1);
  let weekNum=1;
  while(d.getFullYear()<=year){
    const start=new Date(d), end=new Date(d); end.setDate(end.getDate()+6);
    if(start.getFullYear()!==year) break;
    weeks.push({id:year+'-W'+String(weekNum).padStart(2,'0'),weekNum,start:toISO(start),end:toISO(end),month:start.getMonth()});
    d.setDate(d.getDate()+7); weekNum++;
  }
  return weeks;
}
function formatDate(iso,lang){if(!iso)return'';const p=iso.split('-');return parseInt(p[2])+' '+MONTHS_SHORT[lang][parseInt(p[1])-1];}
function formatFullDate(iso,lang){if(!iso)return'';const p=iso.split('-');return parseInt(p[2])+' '+MONTHS_SHORT[lang][parseInt(p[1])-1]+' '+p[0];}
function diffDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/(86400000)); }
function shortName(fullName){
  if(!fullName) return '';
  const parts=fullName.trim().split(/\s+/);
  if(parts.length===1) return parts[0];
  return parts[0]+' '+parts[parts.length-1].charAt(0)+'.';
}
// Regular bookings open a fixed number of months before arrival.
const REGULAR_MONTHS_AHEAD = 3;
function regularOpenDate(weekStart){
  const start=parseISO(weekStart);
  const opens=new Date(start);opens.setMonth(opens.getMonth()-REGULAR_MONTHS_AHEAD);
  return toISO(opens);
}
function isWeekBookableRegular(weekStart){
  const today=new Date();today.setHours(0,0,0,0);
  return toISO(today)>=regularOpenDate(weekStart);
}
function getPhaseMeta(phase,t){
  return {
    clan:{name:t.clanName,desc:t.clanDesc,rule:t.clanRule,icon:PHASES.clan.icon},
    priority:{name:t.priorityName,desc:t.priorityDesc,rule:t.priorityRule,icon:PHASES.priority.icon},
    regular:{name:t.regularName,desc:t.regularDesc,rule:t.regularRule,icon:PHASES.regular.icon},
    board:{name:t.boardBookings,desc:t.boardDesc,rule:t.boardRule,icon:PHASES.board.icon},
  }[phase];
}
function phaseColor(p){return p==='clan'?'#B85042':p==='priority'?'#C4853B':p==='board'?'#5B21B6':'#4A7C59';}
function getPhaseName(p,t){return{clan:t.clanName,priority:t.priorityName,regular:t.regularName,board:t.boardBookings}[p]||p;}
function getPhaseStatus(phaseId, cfg){
  if(!cfg) return 'active';
  const today=toISO(new Date());
  if(phaseId==='clan'){
    if(today<cfg.clan_start) return 'upcoming';
    if(today<=cfg.clan_end) return 'active';
    return 'closed';
  }
  if(phaseId==='priority'){
    if(today<cfg.priority_start) return 'upcoming';
    if(today<=cfg.priority_end) return 'active';
    return 'closed';
  }
  if(phaseId==='board') return 'active';
  // Regular booking runs all year round; the rolling horizon below is the
  // only restriction, so the phase itself never opens or closes.
  return 'active';
}
function getPhaseWindow(phaseId, cfg, lang){
  if(!cfg) return '';
  if(phaseId==='clan') return formatDate(cfg.clan_start,lang)+' \u2013 '+formatDate(cfg.clan_end,lang);
  if(phaseId==='priority') return formatDate(cfg.priority_start,lang)+' \u2013 '+formatDate(cfg.priority_end,lang);
  if(phaseId==='board') return '';
  return (lang==='nl'?'Hele jaar open, 3 maanden vooruit':'All year round, 3 months ahead');
}
function calcBookingCost(guests, weekStart, includeCleaning=true){
  const cleaning = includeCleaning ? CLEANING_FEE : 0;
  if(!guests||!weekStart) return {house:0,person:0,cleaning,total:cleaning,nightsStayed:0};
  let nightsWithPeople=0, personFee=0;
  const g = guests;
  const c04 = g.child04 || (g.child04 === undefined ? [] : g.child04);
  const c59 = g.child59 || [];
  const ad = g.adult || [];
  for(let n=0;n<7;n++){
    const a=c04[n]||0, b=c59[n]||0, c=ad[n]||0;
    if(a+b+c>0) nightsWithPeople++;
    personFee += b*RATES.child59 + c*RATES.adult;
  }
  const house=HOUSE_FEE*nightsWithPeople;
  return {house,person:personFee,cleaning,total:house+personFee+cleaning,nightsStayed:nightsWithPeople};
}
function paymentBadge(status,t){
  const map={not_paid:{label:t.notPaid,color:'#DC2626',bg:'#FEF2F2'},invoice_sent:{label:t.invoiceSent,color:'#D97706',bg:'#FFFBEB'},paid:{label:t.paid,color:'#059669',bg:'#ECFDF5'}};
  const s=map[status]||map.not_paid;
  return <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:10,background:s.bg,color:s.color,whiteSpace:'nowrap'}}>{s.label}</span>;
}

// COST CALCULATOR

function CostCalculator({booking, weeks, onSave, onClose, t, lang}){
  const w = weeks.find(wk=>wk.id===booking.week_id);
  const dayLabels=[t.sat,t.sun,t.mon,t.tue,t.wed,t.thu,t.fri];
  const initGuests = booking.guests || {child04:[0,0,0,0,0,0,0],child59:[0,0,0,0,0,0,0],adult:[0,0,0,0,0,0,0]};
  const [guests, setGuests] = React.useState(()=>JSON.parse(JSON.stringify(initGuests)));
  const [includeCleaning, setIncludeCleaning] = React.useState(booking.include_cleaning===undefined?true:!!booking.include_cleaning);
  const setCell = (row,col,val)=>{const v=Math.max(0,parseInt(val)||0);setGuests(prev=>{const next=JSON.parse(JSON.stringify(prev));next[row][col]=v;return next;});};
  const cost = calcBookingCost(guests, w?w.start:null, includeCleaning);
  const cellStyle={width:42,padding:'6px 2px',border:'1px solid '+COLORS.border,borderRadius:4,fontSize:13,textAlign:'center',outline:'none',fontFamily:"'DM Sans',sans-serif"};
  const rows = [{key:'child04',label:t.child04,rate:'\u20AC0'},{key:'child59',label:t.child59,rate:'\u20AC5'},{key:'adult',label:t.adult,rate:'\u20AC10'}];

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.3)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:COLORS.white,borderRadius:16,padding:28,width:580,maxHeight:'90vh',overflow:'auto',boxShadow:'0 12px 48px rgba(0,0,0,0.15)'}}>
        <h3 style={{fontSize:18,fontWeight:700,color:COLORS.text,margin:'0 0 4px 0',fontFamily:"'Playfair Display',Georgia,serif"}}>{'\u{1F4B0}'} {t.costs}</h3>
        {w && <p style={{fontSize:13,color:COLORS.muted,margin:'0 0 16px 0'}}>W{w.weekNum}: {formatDate(w.start,lang)} &ndash; {formatDate(w.end,lang)}</p>}
        <div style={{overflowX:'auto',marginBottom:16}}>
          <table style={{borderCollapse:'collapse',width:'100%',fontSize:12}}>
            <thead><tr><th style={{textAlign:'left',padding:'6px 8px',fontSize:11,color:COLORS.muted}}></th>
              {dayLabels.map((d,i)=><th key={i} style={{padding:'6px 4px',fontSize:11,color:COLORS.muted,textAlign:'center',fontWeight:600}}>{d}</th>)}
            </tr></thead>
            <tbody>
              {rows.map(row =>
                <tr key={row.key}>
                  <td style={{padding:'6px 8px',fontSize:12,fontWeight:500,color:COLORS.text,whiteSpace:'nowrap'}}>{row.label} <span style={{color:COLORS.muted,fontSize:10}}>{row.rate}/{t.nightLabel.toLowerCase()}</span></td>
                  {[0,1,2,3,4,5,6].map(col=>
                    <td key={col} style={{padding:'4px 2px',textAlign:'center'}}>
                      <input type="number" min={0} value={guests[row.key][col]} onChange={e=>setCell(row.key,col,e.target.value)} style={cellStyle}/>
                    </td>
                  )}
                </tr>
              )}
            </tbody>
          </table>
        </div>
        <div style={{background:'#F8F5F2',borderRadius:12,padding:16,marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:10}}>{t.costSummary}</div>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}><span>{t.houseFee} (&euro;{HOUSE_FEE} &times; {cost.nightsStayed} {t.nights})</span><span style={{fontWeight:600}}>&euro;{cost.house.toFixed(2)}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}><span>{t.perPerson}</span><span style={{fontWeight:600}}>&euro;{cost.person.toFixed(2)}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:13}}>
              <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
                <input type="checkbox" checked={includeCleaning} onChange={e=>setIncludeCleaning(e.target.checked)} style={{cursor:'pointer'}}/>
                <span>{t.includeCleaning}</span>
              </label>
              <span style={{fontWeight:600,opacity:includeCleaning?1:0.4}}>&euro;{(includeCleaning?CLEANING_FEE:0).toFixed(2)}</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:15,fontWeight:700,color:COLORS.text,borderTop:'1px solid '+COLORS.border,paddingTop:8,marginTop:4}}><span>{t.totalCost}</span><span>&euro;{cost.total.toFixed(2)}</span></div>
          </div>
        </div>
        <div style={{background:'#3B6B9E0A',border:'1px solid #3B6B9E20',borderRadius:10,padding:'10px 14px',fontSize:12,color:'#3B6B9E',lineHeight:1.5,marginBottom:16}}>{t.bankInstructions}</div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={onClose} style={{flex:1,padding:'11px 0',background:COLORS.bg,border:'none',borderRadius:10,fontSize:14,fontWeight:500,color:'#5A4D40',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.close}</button>
          <button onClick={()=>onSave(booking.id,guests,cost.total,includeCleaning)} style={{flex:1,padding:'11px 0',background:COLORS.success,border:'none',borderRadius:10,fontSize:14,fontWeight:600,color:'white',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.saveCosts}</button>
        </div>
      </div>
    </div>
  );
}

// Photo when there is one, otherwise the branch-coloured initial that the

function Avatar({user, size=32, onClick}){
  const name = (user && (user.display_name||user.name||user.user_name)) || '?';
  const branch = FAMILY_BRANCHES.find(b=>b.id===(user&&user.branch_id));

                cursor:onClick?'pointer':'default',display:'flex',alignItems:'center',

    {String(name).charAt(0).toUpperCase()}

}

// A name that opens the member's profile card.
function MemberLink({user, onOpen, showAvatar=true, size=22, color, style}){
  if(!user || !user.user_id && !user.id) return <span style={style}>{user&&(user.display_name||user.user_name)}</span>;
  const id = user.user_id||user.id;
  return <span onClick={e=>{e.stopPropagation();onOpen&&onOpen(id);}}
    style={{display:'inline-flex',alignItems:'center',gap:5,cursor:onOpen?'pointer':'default',...(style||{})}}>
    {showAvatar && <Avatar user={user} size={size}/>}
    <span style={{color:color,textDecoration:onOpen?'underline dotted':'none',textUnderlineOffset:2}}>{user.display_name||user.user_name}</span>
  </span>;
}

function StaysList({userId, t, lang}){
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState('');
  const [expanded, setExpanded] = React.useState(false);
  React.useEffect(()=>{
    let live = true;
    setData(null); setError('');
    api('profile/stays'+(userId?('/'+userId):''))
      .then(d=>{ if(live) setData(d); })
      .catch(e=>{ if(live) setError(e.message); });
    return ()=>{ live=false; };
  },[userId]);

  if(error) return <div style={{fontSize:12,color:COLORS.muted}}>{error}</div>;
  if(!data) return <div style={{fontSize:12,color:COLORS.muted}}>{t.loading}</div>;

  const upcoming = data.stays.filter(s=>s.upcoming);
  const past = data.stays.filter(s=>!s.upcoming);
  const shown = expanded ? past : past.slice(0,3);
  const hidden = past.length - shown.length;

  const row = (st,isUp)=>(
    <div key={st.booking_id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',borderRadius:8,
      background:isUp?COLORS.success+'12':'#F8F5F2',borderLeft:'3px solid '+(isUp?COLORS.success:'#E0D8CF')}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,color:COLORS.text,fontWeight:isUp?600:500}}>
          {formatDate(st.check_in_date,lang)} &rarr; {formatDate(st.check_out_date,lang)}
        </div>
        <div style={{fontSize:11,color:COLORS.muted}}>
          {st.nights} {st.nights===1?t.nightLabel:t.nightsLabel}
          {st.guests?(' · '+st.guests+' '+t.people):''}
        </div>
      </div>
      {isUp && <span style={{fontSize:10,fontWeight:700,color:COLORS.success}}>{t.upcomingStay}</span>}
    </div>
  );

  return (
    <div style={{display:'flex',flexDirection:'column',gap:6}}>
      {upcoming.map(st=>row(st,true))}
      {past.length===0 && upcoming.length===0 && <div style={{fontSize:12,color:COLORS.muted}}>{t.noStaysYet}</div>}
      {shown.map(st=>row(st,false))}
      {hidden>0 && <button onClick={()=>setExpanded(true)} style={{background:'none',border:'none',color:COLORS.accent,fontSize:12,cursor:'pointer',padding:'4px 0',textAlign:'left',fontFamily:"'DM Sans',sans-serif"}}>
        {t.showEarlier.replace('%n',hidden)}
      </button>}
      {expanded && past.length>3 && <button onClick={()=>setExpanded(false)} style={{background:'none',border:'none',color:COLORS.muted,fontSize:12,cursor:'pointer',padding:'4px 0',textAlign:'left',fontFamily:"'DM Sans',sans-serif"}}>
        {t.showFewer}
      </button>}
      {past.length>0 && <div style={{display:'flex',gap:14,marginTop:6,paddingTop:8,borderTop:'1px solid '+COLORS.border}}>
        {[[t.totalStays,data.totals.stays],[t.totalNights,data.totals.nights],
          [t.firstVisit,data.totals.first_visit?formatDate(data.totals.first_visit,lang):'—']].map(([label,val])=>
          <div key={label}><div style={{fontSize:15,fontWeight:700,color:COLORS.text}}>{val}</div>
            <div style={{fontSize:10,color:COLORS.muted,textTransform:'uppercase',letterSpacing:'0.5px'}}>{label}</div></div>)}
      </div>}
    </div>
  );
}

function ProfileEditForm({profile, onSaved, onCancel, showToast, t, lang}){
  const [bio, setBio] = React.useState(profile.bio||'');
  const [cc, setCc] = React.useState(()=>{
    const p = profile.phone_e164||'';
    const hit = COUNTRY_CODES.find(([code])=>p.startsWith(code));
    return hit?hit[0]:'+31';
  });
  const [phone, setPhone] = React.useState(()=>{
    const p = profile.phone_e164||'';
    const hit = COUNTRY_CODES.find(([code])=>p.startsWith(code));
    return hit?p.slice(hit[0].length):p.replace(/^\+/,'');
  });
  const [town, setTown] = React.useState(profile.home_town||'');
  const [langs, setLangs] = React.useState((profile.languages||'').split(',').filter(Boolean));
  const [household, setHousehold] = React.useState(profile.household_size||'');
  const [prefStay, setPrefStay] = React.useState(profile.pref_stay||'none');
  const [prefSeason, setPrefSeason] = React.useState(profile.pref_season||'');
  const [skills, setSkills] = React.useState(profile.skills||[]);
  const [shareDefault, setShareDefault] = React.useState(!!profile.open_to_share_default);
  const [vis, setVis] = React.useState({
    vis_photo_bio: profile.vis_photo_bio!==false,
    vis_phone:     profile.vis_phone!==false,
    vis_town:      profile.vis_town!==false,
    vis_stays:     !!profile.vis_stays,
  });
  const [photoUrl, setPhotoUrl] = React.useState(profile.photo_url||profile.photo_path||null);
  const [busy, setBusy] = React.useState(false);
  const fileRef = React.useRef(null);

  const iS={width:'100%',padding:'10px 14px',border:'1.5px solid '+COLORS.border,borderRadius:10,fontSize:14,outline:'none',fontFamily:"'DM Sans',sans-serif",boxSizing:'border-box',background:'white'};
  const labelS={fontSize:11,fontWeight:600,color:COLORS.muted,display:'block',marginBottom:4};

  const toggle = (list,setList,val)=> setList(list.includes(val)?list.filter(x=>x!==val):[...list,val]);

  const uploadPhoto = async (file)=>{
    if(!file) return;
    setBusy(true);
    try{
      const fd = new FormData(); fd.append('photo', file);
      const res = await apiUpload('profile/photo', fd);
      setPhotoUrl(res.photo_url||res.photo_path);
    }catch(e){ showToast(e.message); }
    setBusy(false);
  };
  const removePhoto = async ()=>{
    setBusy(true);
    try{ await api('profile/photo',{method:'DELETE'}); setPhotoUrl(null); showToast(t.photoRemoved); }
    catch(e){ showToast(e.message); }
    setBusy(false);
  };
  const save = async ()=>{
    setBusy(true);
    try{
      const saved = await api('profile/me',{method:'PUT',body:JSON.stringify({
        bio, phone_e164: phone.trim()? (cc+phone) : '', home_town: town,
        languages: langs, household_size: household===''?null:parseInt(household),
        pref_stay: prefStay, pref_season: prefSeason, skills,
        open_to_share_default: shareDefault, ...vis,
      })});
      showToast(t.profileSaved);
      onSaved && onSaved(saved);
    }catch(e){ showToast(e.message); }
    setBusy(false);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{display:'flex',alignItems:'center',gap:14}}>
        <Avatar user={{display_name:profile.display_name,branch_id:profile.branch_id,photo_url:photoUrl}} size={64}/>
        <div style={{flex:1}}>
          <input ref={fileRef} type="file" accept="image/jpeg,image/png,image/webp" style={{display:'none'}}
            onChange={e=>uploadPhoto(e.target.files&&e.target.files[0])}/>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            <button onClick={()=>fileRef.current&&fileRef.current.click()} disabled={busy} style={{padding:'7px 12px',background:'transparent',border:'1.5px solid '+COLORS.border,borderRadius:8,fontSize:12,fontWeight:600,color:COLORS.text,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.uploadPhoto}</button>
            {photoUrl && <button onClick={removePhoto} disabled={busy} style={{padding:'7px 12px',background:'transparent',border:'1.5px solid '+COLORS.border,borderRadius:8,fontSize:12,color:COLORS.muted,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.removePhoto}</button>}
          </div>
          <div style={{fontSize:10,color:COLORS.muted,marginTop:5}}>{t.photoHint}</div>
        </div>
      </div>

      <div>
        <label style={labelS}>{t.bioLabel}</label>
        <textarea rows={2} value={bio} maxLength={200} onChange={e=>setBio(e.target.value)} placeholder={t.bioHint} style={{...iS,resize:'vertical'}}/>
        <div style={{fontSize:10,color:bio.length>180?COLORS.warning:COLORS.muted,marginTop:3,textAlign:'right'}}>{200-bio.length} {t.charsLeft}</div>
      </div>

      <div>
        <label style={labelS}>{t.phoneLabel}</label>
        <div style={{display:'flex',gap:8}}>
          <select value={cc} onChange={e=>setCc(e.target.value)} style={{...iS,width:110,flexShrink:0}}>
            {COUNTRY_CODES.map(([code,name])=><option key={code} value={code}>{name} {code}</option>)}
          </select>
          <input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="6 12345678" style={iS}/>
        </div>
      </div>

      <div style={{display:'flex',gap:8}}>
        <div style={{flex:1}}><label style={labelS}>{t.homeTownLabel}</label>
          <input type="text" value={town} maxLength={80} onChange={e=>setTown(e.target.value)} style={iS}/></div>
        <div style={{width:130}}><label style={labelS}>{t.householdLabel}</label>
          <input type="number" min={1} max={50} value={household} onChange={e=>setHousehold(e.target.value)} style={iS}/></div>
      </div>

      <div style={{display:'flex',gap:8}}>
        <div style={{flex:1}}><label style={labelS}>{t.prefStayLabel}</label>
          <select value={prefStay} onChange={e=>setPrefStay(e.target.value)} style={iS}>
            {['none','week','midweek','weekend'].map(k=><option key={k} value={k}>{stayPrefLabel(k,t)}</option>)}
          </select></div>
        <div style={{flex:1}}><label style={labelS}>{t.prefSeasonLabel}</label>
          <select value={prefSeason} onChange={e=>setPrefSeason(e.target.value)} style={iS}>
            <option value="">—</option>
            {SEASONS.map(sn=><option key={sn} value={sn}>{seasonLabel(sn,t)}</option>)}
          </select></div>
      </div>

      <div>
        <label style={labelS}>{t.languagesLabel}</label>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {['nl','en','de','fr'].map(code=>{
            const on = langs.includes(code);
            return <button key={code} onClick={()=>toggle(langs,setLangs,code)} style={{padding:'6px 12px',borderRadius:16,border:'1.5px solid '+(on?COLORS.success:COLORS.border),background:on?COLORS.success+'18':'transparent',color:on?COLORS.success:COLORS.muted,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{code.toUpperCase()}</button>;
          })}
        </div>
      </div>

      <div>
        <label style={labelS}>{t.skillsLabel}</label>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {SKILL_SLUGS.map(slug=>{
            const on = skills.includes(slug);
            return <button key={slug} onClick={()=>toggle(skills,setSkills,slug)} style={{padding:'6px 12px',borderRadius:16,border:'1.5px solid '+(on?COLORS.board:COLORS.border),background:on?COLORS.board+'18':'transparent',color:on?COLORS.board:COLORS.muted,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{skillLabel(slug,t)}</button>;
          })}
        </div>
      </div>

      <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:COLORS.text,cursor:'pointer'}}>
        <input type="checkbox" checked={shareDefault} onChange={()=>setShareDefault(!shareDefault)}/>{t.shareDefaultLabel}
      </label>

      <div style={{padding:14,background:COLORS.bg,borderRadius:10}}>
        <div style={{fontSize:12,fontWeight:700,color:COLORS.text,marginBottom:8}}>{'\u{1F512}'} {t.whoSeesWhat}</div>
        {[['vis_photo_bio',t.visPhotoBio],['vis_phone',t.visPhone],['vis_town',t.visTown],['vis_stays',t.visStays]].map(([k,label])=>
          <label key={k} style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:COLORS.text,cursor:'pointer',marginBottom:6}}>
            <input type="checkbox" checked={!!vis[k]} onChange={()=>setVis({...vis,[k]:!vis[k]})}/>{label}
          </label>)}
        <div style={{fontSize:10,color:COLORS.muted,marginTop:4}}>{t.visNote}</div>
      </div>

      <div style={{display:'flex',gap:8}}>
        <button onClick={onCancel} style={{flex:1,padding:'11px 0',background:COLORS.bg,border:'none',borderRadius:10,fontSize:14,fontWeight:600,color:COLORS.text,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.close}</button>
        <button onClick={save} disabled={busy} style={{flex:2,padding:'11px 0',background:busy?'#D4C5B5':COLORS.success,border:'none',borderRadius:10,fontSize:14,fontWeight:600,color:'white',cursor:busy?'default':'pointer',fontFamily:"'DM Sans',sans-serif"}}>{busy?t.loading:t.saveProfile}</button>
      </div>
    </div>
  );
}

function ProfileCard({userId, self, onClose, showToast, t, lang}){
  const [profile, setProfile] = React.useState(null);
  const [error, setError] = React.useState('');
  const [editing, setEditing] = React.useState(false);
  const [preview, setPreview] = React.useState(false);

  const load = React.useCallback(()=>{
    setError('');
    api(self?'profile/me':('profile/'+userId))
      .then(setProfile).catch(e=>setError(e.message));
  },[userId,self]);
  React.useEffect(load,[load]);

  const branch = profile ? FAMILY_BRANCHES.find(b=>b.id===profile.branch_id) : null;
  const color = branch?branch.color:COLORS.muted;

  // "See it as others do" applies the same visibility rules the server
  // would, so the preview matches what another member actually receives.
  const shown = (!self || !preview) ? profile : (profile && {
    ...profile,
    photo_url: profile.vis_photo_bio?profile.photo_url:null,
    bio:       profile.vis_photo_bio?profile.bio:null,
    phone_e164:profile.vis_phone?profile.phone_e164:null,
    email:     profile.vis_phone?profile.email:null,
    home_town: profile.vis_town?profile.home_town:null,
    stays_visible: profile.vis_stays,
  });

  const chip = (text,key)=><span key={key} style={{fontSize:11,padding:'4px 10px',borderRadius:14,background:COLORS.bg,color:COLORS.text}}>{text}</span>;
  const canSeeStays = self ? true : (profile && profile.stays_visible);
  const wa = shown && shown.phone_e164 ? waLink(shown.phone_e164) : null;

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.3)',zIndex:220,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:COLORS.white,borderRadius:16,width:420,maxWidth:'100%',maxHeight:'88vh',overflow:'auto',boxShadow:'0 12px 48px rgba(0,0,0,0.15)'}}>
        {error && <div style={{padding:24,fontSize:13,color:COLORS.danger}}>{error}</div>}
        {!profile && !error && <div style={{padding:24,fontSize:13,color:COLORS.muted}}>{t.loading}</div>}
        {profile && <>
          <div style={{height:72,background:color+'22',borderRadius:'16px 16px 0 0'}}/>
          <div style={{padding:'0 24px 24px 24px',marginTop:-34}}>
            <div style={{display:'flex',alignItems:'flex-end',gap:12,marginBottom:12}}>
              <div style={{border:'3px solid '+COLORS.white,borderRadius:'50%',lineHeight:0}}>
                <Avatar user={{display_name:profile.display_name,branch_id:profile.branch_id,photo_url:shown.photo_url}} size={68}/>
              </div>
              <div style={{paddingBottom:6,minWidth:0}}>
                <div style={{fontSize:17,fontWeight:700,color:COLORS.text,fontFamily:"'Playfair Display',Georgia,serif"}}>{profile.display_name}</div>
                <div style={{fontSize:11,color:color,fontWeight:600}}>{branch?branch.name:''}
                  {profile.role==='family_member' && <span style={{marginLeft:6,fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:8,background:COLORS.board+'18',color:COLORS.board}}>{t.familyBadge}</span>}
                  {profile.role==='admin' && <span style={{marginLeft:6,fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:8,background:COLORS.accent+'18',color:COLORS.accent}}>{t.roleAdmin}</span>}
                </div>
              </div>
            </div>

            {editing ? <ProfileEditForm profile={profile} showToast={showToast} t={t} lang={lang}
                          onCancel={()=>setEditing(false)}
                          onSaved={p=>{setProfile(p);setEditing(false);}}/>
            : <>
              {shown.bio && <div style={{fontSize:14,color:COLORS.text,marginBottom:12,lineHeight:1.5}}>{shown.bio}</div>}

              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
                {shown.home_town && chip('\u{1F4CD} '+shown.home_town,'town')}
                {shown.languages && chip('\u{1F5E3} '+shown.languages.toUpperCase().split(',').join(' · '),'langs')}
                {shown.household_size && chip('\u{1F465} '+shown.household_size+' '+t.people,'hh')}
              </div>

              <div style={{fontSize:12,color:COLORS.muted,marginBottom:4}}>
                {t.prefStayLabel}: <strong style={{color:COLORS.text}}>{stayPrefLabel(shown.pref_stay,t)}</strong>
                {shown.pref_season?(' · '+seasonLabel(shown.pref_season,t)):''}
              </div>
              {shown.open_to_share_default && <div style={{fontSize:12,color:'#8A6D00',marginBottom:10}}>{'\u{1F91D}'} {t.openToShare}</div>}

              {shown.skills && shown.skills.length>0 && <div style={{marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:600,color:COLORS.muted,marginBottom:5}}>{t.skillsLabel}</div>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {shown.skills.map(sl=><span key={sl} style={{fontSize:11,fontWeight:600,padding:'4px 10px',borderRadius:14,background:COLORS.board+'14',color:COLORS.board}}>{skillLabel(sl,t)}</span>)}
                </div>
              </div>}

              {!self && (wa||shown.email) && <div style={{display:'flex',gap:8,marginBottom:14}}>
                {wa && <a href={wa} target="_blank" rel="noopener noreferrer" style={{flex:1,textAlign:'center',padding:'10px 0',background:'#25D366',color:'white',borderRadius:10,textDecoration:'none',fontWeight:600,fontSize:13}}>{t.messageWhatsApp}</a>}
                {shown.email && <a href={'mailto:'+shown.email} style={{flex:1,textAlign:'center',padding:'10px 0',background:COLORS.bg,color:COLORS.text,borderRadius:10,textDecoration:'none',fontWeight:600,fontSize:13}}>{t.messageEmail}</a>}
              </div>}

              <div style={{marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',letterSpacing:'1px',marginBottom:8}}>{t.staysTitle}</div>
                {canSeeStays ? <StaysList userId={self?0:userId} t={t} lang={lang}/>
                  : <div style={{fontSize:12,color:COLORS.muted}}>{t.staysPrivate}</div>}
              </div>

              {self && <div style={{display:'flex',gap:8}}>
                <button onClick={()=>setEditing(true)} style={{flex:2,padding:'11px 0',background:COLORS.accent,border:'none',borderRadius:10,fontSize:14,fontWeight:600,color:'white',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.editProfile}</button>
                <button onClick={()=>setPreview(!preview)} style={{flex:2,padding:'11px 0',background:'transparent',border:'1.5px solid '+COLORS.border,borderRadius:10,fontSize:13,fontWeight:600,color:COLORS.muted,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{preview?t.backToMyView:t.previewAsOthers}</button>
              </div>}
            </>}
            <button onClick={onClose} style={{marginTop:10,width:'100%',padding:'10px 0',background:COLORS.bg,border:'none',borderRadius:10,fontSize:14,fontWeight:500,color:'#5A4D40',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.close}</button>
          </div>
        </>}
      </div>
    </div>
  );
}

function Directory({onOpenProfile, t, lang}){
  const [rows, setRows] = React.useState(null);
  const [q, setQ] = React.useState('');
  const [branchFilter, setBranchFilter] = React.useState(0);
  const [shareOnly, setShareOnly] = React.useState(false);

  React.useEffect(()=>{ api('profile/directory').then(setRows).catch(()=>setRows([])); },[]);
  if(!rows) return <div style={{fontSize:13,color:COLORS.muted}}>{t.loading}</div>;

  const needle = q.trim().toLowerCase();
  const match = (m)=>{
    if(branchFilter && m.branch_id!==branchFilter) return false;
    if(shareOnly && !m.open_to_share_default) return false;
    if(!needle) return true;
    const hay = [m.display_name, m.home_town||'', (m.skills||[]).map(sl=>skillLabel(sl,t)).join(' ')].join(' ').toLowerCase();
    return hay.includes(needle);
  };
  const shown = rows.filter(match);
  const byBranch = {};
  shown.forEach(m=>{ (byBranch[m.branch_id] = byBranch[m.branch_id]||[]).push(m); });

  const iS={padding:'10px 14px',border:'1.5px solid '+COLORS.border,borderRadius:10,fontSize:14,outline:'none',fontFamily:"'DM Sans',sans-serif",background:'white'};
  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        <input type="text" value={q} onChange={e=>setQ(e.target.value)} placeholder={t.searchMembers} style={{...iS,flex:1,minWidth:180}}/>
        <select value={branchFilter} onChange={e=>setBranchFilter(parseInt(e.target.value))} style={iS}>
          <option value={0}>{t.all} — {t.filterBranch}</option>
          {FAMILY_BRANCHES.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
        </select>
        <button onClick={()=>setShareOnly(!shareOnly)} style={{...iS,cursor:'pointer',fontWeight:600,border:'1.5px solid '+(shareOnly?COLORS.openToShare:COLORS.border),color:shareOnly?'#8A6D00':COLORS.muted,background:shareOnly?COLORS.openToShare+'18':'white'}}>{'\u{1F91D}'} {t.openToShareFilter}</button>
      </div>
      {shown.length===0 && <div style={{fontSize:13,color:COLORS.muted,padding:12}}>{t.noMembersFound}</div>}
      {FAMILY_BRANCHES.filter(b=>byBranch[b.id]).map(b=>(
        <div key={b.id} style={{marginBottom:18}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
            <div style={{width:10,height:10,borderRadius:3,background:b.color}}/>
            <div style={{fontSize:12,fontWeight:700,color:COLORS.muted,textTransform:'uppercase',letterSpacing:'1px'}}>{b.name}</div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:8}}>
            {byBranch[b.id].map(m=>(

                    {m.display_name}{m.open_to_share_default?' \u{1F91D}':''}

// ═══════════════════════════════════════════════════════
// BOOKING MANAGER (admin: edit dates / share / remark, or delete)
// ═══════════════════════════════════════════════════════
function BookingManager({bookings=[], weeks=[], onEditBooking, onDeleteBooking, t, lang}){
  const [editBk, setEditBk] = React.useState(null);
  const [edIn, setEdIn] = React.useState('');
  const [edOut, setEdOut] = React.useState('');
  const [edShare, setEdShare] = React.useState(false);
  const [edRemark, setEdRemark] = React.useState('');
  const [edNote, setEdNote] = React.useState('');
  const iS={width:'100%',padding:'10px 14px',border:'1.5px solid #E0D8CF',borderRadius:10,fontSize:14,outline:'none',background:'white',fontFamily:"'DM Sans',sans-serif",boxSizing:'border-box'};

  const weekFor = (b)=>{
    const bw = (weeks||[]).find(wk=>wk.id===b.week_id);
    if(bw) return bw;
    const gen = generateWeeks(b.year||new Date().getFullYear());
    return gen.find(wk=>wk.id===b.week_id);
  };
  const startEdit = (b)=>{
    const w = weekFor(b);
    setEditBk(b);
    setEdIn(b.check_in_date || (w?w.start:''));
    setEdOut(b.check_out_date || (w?weekDeparture(w):''));
    setEdShare(!!b.open_to_share);
    setEdRemark(b.remarks||'');
    setEdNote('');
  };

  const live = (bookings||[]).filter(b=>b.cancellation_status!=='approved');
  const sorted = [...live].sort((a,b)=>{
    const wa=weekFor(a), wb=weekFor(b);
    const da=a.check_in_date||(wa?wa.start:''), db2=b.check_in_date||(wb?wb.start:'');
    return da<db2?-1:da>db2?1:0;
  });

  if(sorted.length===0) return <div style={{padding:16,textAlign:'center',color:COLORS.muted,fontSize:14}}>{t.noData}</div>;

  return (
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {sorted.map(b=>{
        const w = weekFor(b);
        const inD = b.check_in_date || (w?w.start:''), outD = b.check_out_date || (w?weekDeparture(w):'');
        const isEditing = editBk && editBk.id===b.id;
        const br = FAMILY_BRANCHES.find(x=>x.id===b.branch_id);
        const badDates = !edIn || !edOut || edOut<=edIn;
        return <div key={b.id} style={{padding:'10px 14px',background:'#F8F5F2',borderRadius:10,borderLeft:'3px solid '+(b.open_to_share?COLORS.openToShare:(br?br.color:'#ccc'))}}>
          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <div style={{flex:1,minWidth:160}}>
              <div style={{fontSize:13,fontWeight:600,color:COLORS.text}}>{b.user_name||'—'}{b.open_to_share?' \u00B7 \u{1F91D}':''}</div>
              <div style={{fontSize:11,color:COLORS.muted}}>{formatDate(inD,lang)} &rarr; {formatDate(outD,lang)} &middot; {getPhaseName(b.phase,t)}{b.cancellation_status==='pending'?' \u00B7 \u23F3':''}</div>
              {b.remarks && <div style={{fontSize:11,color:COLORS.muted,fontStyle:'italic',marginTop:2}}>{'\u{1F4AC}'} {b.remarks}</div>}
            </div>
            <button onClick={()=>isEditing?setEditBk(null):startEdit(b)} style={{padding:'6px 12px',background:'transparent',border:'1.5px solid '+COLORS.border,borderRadius:8,fontSize:11,color:COLORS.text,cursor:'pointer',fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>{isEditing?t.close:('\u270F\uFE0F '+t.editEvent)}</button>
            <button onClick={()=>{
                if(!window.confirm(t.confirmDeleteBooking)) return;
                const reason = window.prompt(t.deleteReasonPrompt+' '+(b.user_name||''), '');
                if(reason===null) return;
                onDeleteBooking(b, reason);
              }} style={{padding:'6px 12px',background:'transparent',border:'1.5px solid '+COLORS.danger,borderRadius:8,fontSize:11,color:COLORS.danger,cursor:'pointer',fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>{'\u{1F5D1}'} {t.deleteBooking}</button>
          </div>
          {isEditing && <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+COLORS.border,display:'flex',flexDirection:'column',gap:8}}>
            <div style={{display:'flex',gap:8}}>
              <div style={{flex:1}}><label style={{fontSize:11,fontWeight:600,color:COLORS.muted,display:'block',marginBottom:4}}>{t.checkIn}</label>
                <input type="date" value={edIn} onChange={e=>setEdIn(e.target.value)} style={iS}/></div>
              <div style={{flex:1}}><label style={{fontSize:11,fontWeight:600,color:COLORS.muted,display:'block',marginBottom:4}}>{t.checkOut}</label>
                <input type="date" value={edOut} onChange={e=>setEdOut(e.target.value)} style={iS}/></div>
            </div>
            <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:COLORS.text,cursor:'pointer'}}>
              <input type="checkbox" checked={edShare} onChange={()=>setEdShare(!edShare)}/>{t.openToShare}
            </label>
            <input type="text" placeholder={t.addRemark} value={edRemark} onChange={e=>setEdRemark(e.target.value)} style={iS}/>
            <div>
              <label style={{fontSize:11,fontWeight:600,color:COLORS.muted,display:'block',marginBottom:4}}>{t.adminNote}</label>
              <textarea rows={2} placeholder={t.adminNoteHint} value={edNote} onChange={e=>setEdNote(e.target.value)} style={{...iS,resize:'vertical'}}/>
              <div style={{fontSize:10,color:COLORS.muted,marginTop:4}}>{'\u2709'} {t.noteEmailed} {b.user_name}</div>
            </div>
            <button onClick={async()=>{await onEditBooking(b,{check_in_date:edIn,check_out_date:edOut,open_to_share:edShare,remarks:edRemark,admin_note:edNote});setEditBk(null);}}
              disabled={badDates}
              style={{padding:'9px 0',background:badDates?'#D4C5B5':COLORS.success,border:'none',borderRadius:10,fontSize:13,fontWeight:600,color:'white',cursor:badDates?'default':'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.saveEvent}</button>
            {edIn&&edOut&&edOut<=edIn && <div style={{fontSize:11,color:COLORS.danger}}>{t.departAfterArrive}</div>}
          </div>}
        </div>;
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// BOOKING DIALOG
// ═══════════════════════════════════════════════════════
function BookingDialog({week, phase, presetCheckIn, presetCheckOut, user, registeredUsers=[], shareDefault=false, onConfirm, onCancel, t, lang}){
  // Pre-filled from the member's profile preference; still theirs to change.
  const [openToShare, setOpenToShare] = React.useState(!!shareDefault);
  const [remark, setRemark] = React.useState('');
  const [linked, setLinked] = React.useState([]);
  const [useCustom, setUseCustom] = React.useState(!!(presetCheckIn||presetCheckOut));
  const [checkIn, setCheckIn] = React.useState(presetCheckIn || (week?week.start:''));
  const [checkOut, setCheckOut] = React.useState(presetCheckOut || (week?weekDeparture(week):''));
  const isRegular = phase==='regular';
  const others = registeredUsers.filter(u=>u.email!==user.email);
  const toggleLinked = (email)=>setLinked(prev=>prev.includes(email)?prev.filter(e=>e!==email):[...prev,email]);
  const weekLabel = week ? formatDate(week.start,lang)+' \u2014 '+formatDate(weekDeparture(week),lang) : '';
  let customValid=true, nightCount=0;
  if(isRegular && useCustom){
    if(checkIn && checkOut){nightCount=diffDays(checkIn,checkOut);if(nightCount<1||nightCount>7)customValid=false;}
    else customValid=false;
  }
  const effIn = (isRegular && useCustom && customValid) ? checkIn : (week?week.start:'');
  const effOut = (isRegular && useCustom && customValid) ? checkOut : (week?weekDeparture(week):'');
  const effLabel = (effIn && effOut) ? (formatDate(effIn,lang)+' \u2014 '+formatDate(effOut,lang)) : weekLabel;
  const iS={width:'100%',padding:'10px 14px',border:'1.5px solid '+COLORS.border,borderRadius:10,fontSize:14,outline:'none',fontFamily:"'DM Sans',sans-serif",boxSizing:'border-box'};
  // Common stay shapes. Weeks start on Friday, so within a week:
  // weekend = Fri->Mon (3 nights), midweek = Mon->Fri (4 nights).
  const applyPreset = (kind)=>{
    if(!week) return;
    const start = parseISO(week.start);
    const shift = (n)=>{const d=new Date(start);d.setDate(d.getDate()+n);return toISO(d);};
    setUseCustom(kind!=='week');
    if(kind==='weekend'){ setCheckIn(shift(0)); setCheckOut(shift(3)); }
    else if(kind==='midweek'){ setCheckIn(shift(3)); setCheckOut(shift(7)); }
    else { setCheckIn(week.start); setCheckOut(weekDeparture(week)); }
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.3)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onCancel}>
      <div onClick={e=>e.stopPropagation()} style={{background:COLORS.white,borderRadius:16,padding:28,width:460,maxHeight:'85vh',overflow:'auto',boxShadow:'0 12px 48px rgba(0,0,0,0.15)'}}>
        <h3 style={{fontSize:18,fontWeight:700,color:COLORS.text,margin:'0 0 6px 0',fontFamily:"'Playfair Display',Georgia,serif"}}>{t.confirmBooking}</h3>
        <p style={{fontSize:14,color:COLORS.text,margin:'0 0 8px 0'}}>{t.confirmBookQ}?</p>
        <div style={{background:COLORS.bg,borderRadius:10,padding:'10px 14px',marginBottom:16,fontSize:13,color:COLORS.text}}>
          <div style={{fontSize:11,fontWeight:600,color:COLORS.muted,marginBottom:4}}>{t.confirmDates}</div>
          <div style={{fontWeight:600}}>{effLabel}</div>
          <div style={{fontSize:12,color:COLORS.muted,marginTop:2}}>{t.checkIn}: {effIn} → {t.checkOut}: {effOut}</div>
        </div>
        {isRegular && <div style={{marginBottom:16}}>
          <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>
            {[['week',t.presetWeek],['weekend',t.presetWeekend],['midweek',t.presetMidweek]].map(([k,label])=>
              <button key={k} type="button" onClick={()=>applyPreset(k)} style={{padding:'6px 12px',borderRadius:8,border:'1.5px solid '+COLORS.border,background:'transparent',color:COLORS.text,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{label}</button>)}
          </div>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:COLORS.text,cursor:'pointer',marginBottom:10}}>
            <input type="checkbox" checked={useCustom} onChange={()=>setUseCustom(!useCustom)}/>{t.customDates}
          </label>
          {useCustom && <div style={{display:'flex',gap:8}}>
            <div style={{flex:1}}><label style={{fontSize:11,fontWeight:600,color:COLORS.muted,display:'block',marginBottom:4}}>{t.checkIn}</label><input style={iS} type="date" value={checkIn} onChange={e=>setCheckIn(e.target.value)}/></div>
            <div style={{flex:1}}><label style={{fontSize:11,fontWeight:600,color:COLORS.muted,display:'block',marginBottom:4}}>{t.checkOut}</label><input style={iS} type="date" value={checkOut} onChange={e=>setCheckOut(e.target.value)}/></div>
          </div>}
          {useCustom && customValid && nightCount>0 && <div style={{fontSize:12,color:COLORS.muted,marginTop:6}}>{nightCount} {nightCount===1?t.nightLabel:t.nightsLabel}</div>}
          {useCustom && !customValid && <div style={{fontSize:12,color:COLORS.danger,marginTop:6}}>{t.maxNights}</div>}
        </div>}
        <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:COLORS.text,cursor:'pointer',marginBottom:16}}>
          <input type="checkbox" checked={openToShare} onChange={()=>setOpenToShare(!openToShare)}/>{t.openToShare}
        </label>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,fontWeight:600,color:COLORS.muted,display:'block',marginBottom:6}}>{t.addRemark}</label>
          <textarea style={{...iS,resize:'vertical'}} rows={2} value={remark} onChange={e=>setRemark(e.target.value)}/>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={onCancel} style={{flex:1,padding:'11px 0',background:COLORS.bg,border:'none',borderRadius:10,fontSize:14,fontWeight:500,color:'#5A4D40',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.cancelBtn}</button>
          <button onClick={()=>onConfirm({open_to_share:openToShare,remark,linked_members:linked,custom_start:isRegular&&useCustom&&customValid?checkIn:null,custom_end:isRegular&&useCustom&&customValid?checkOut:null})} disabled={isRegular&&useCustom&&!customValid} style={{flex:1,padding:'11px 0',background:(isRegular&&useCustom&&!customValid)?'#D4C5B5':COLORS.success,border:'none',borderRadius:10,fontSize:14,fontWeight:600,color:'white',cursor:(isRegular&&useCustom&&!customValid)?'default':'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.yesBook}</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// ADMIN PANEL
// ═══════════════════════════════════════════════════════
function AdminPanel({registeredUsers=[], weeks, year, bookings=[], onBooked, onApproveCancellation, onRejectCancellation, onUpdatePayment, onCreateBoardEvent, onEditBooking, onDeleteBooking, onClose, t, lang}){

  const [tab, setTab] = React.useState('manual');
  const [selUser, setSelUser] = React.useState('');
  const [selWeek, setSelWeek] = React.useState('');
  const [selPhase, setSelPhase] = React.useState('regular');
  const [unpaidOnly, setUnpaidOnly] = React.useState(false);
  const [evName, setEvName] = React.useState('');
  const [evDesc, setEvDesc] = React.useState('');
  const [evStart, setEvStart] = React.useState('');
  const [evEnd, setEvEnd] = React.useState('');
  const [emailText, setEmailText] = React.useState('');
  const [parsing, setParsing] = React.useState(false);
  const [parseResult, setParseResult] = React.useState(null);

  const pending = bookings.filter(b=>b.cancellation_status==='pending');
  const paymentBookings = unpaidOnly ? bookings.filter(b=>b.cancellation_status!=='approved'&&b.payment_status!=='paid') : bookings.filter(b=>b.cancellation_status!=='approved');

  const handleSubmit = ()=>{
    if(!selUser||!selWeek) return;
    const u = registeredUsers.find(x=>String(x.id)===selUser||x.email===selUser);
    if(u) onBooked(selWeek, u, selPhase);
    onClose();
  };
  const handleCreateEvent = async ()=>{
    if(!evName||!evStart||!evEnd) return;
    await onCreateBoardEvent({name:evName,description:evDesc,start_date:evStart,end_date:evEnd});
    setEvName('');setEvDesc('');setEvStart('');setEvEnd('');
  };
  const handleParseEmail = async ()=>{
    if(!emailText.trim()) return;
    setParsing(true);setParseResult(null);
    try {
      const data = await api(`admin/parse-email?year=${year}`, {method:'POST',body:JSON.stringify({email_text:emailText})});
      setParseResult(data);
    } catch(e){ setParseResult({error:e.message}); }
    setParsing(false);
  };

  const tabBtn = (id,label,badge)=>
    <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:'8px 0',border:'none',borderRadius:8,background:tab===id?COLORS.white:'transparent',color:tab===id?COLORS.text:COLORS.muted,fontWeight:tab===id?600:400,cursor:'pointer',fontSize:10,boxShadow:tab===id?'0 1px 4px rgba(0,0,0,0.08)':'none',fontFamily:"'DM Sans',sans-serif",position:'relative'}}>
      {label}{badge>0 && <span style={{position:'absolute',top:-4,right:4,background:COLORS.danger,color:'white',fontSize:9,fontWeight:700,padding:'1px 5px',borderRadius:8}}>{badge}</span>}
    </button>;
  const iS={width:'100%',padding:'10px 14px',border:'1.5px solid #E0D8CF',borderRadius:10,fontSize:14,outline:'none',background:'white',fontFamily:"'DM Sans',sans-serif",marginBottom:10,boxSizing:'border-box'};

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.3)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:COLORS.white,borderRadius:16,padding:28,width:580,maxHeight:'85vh',overflow:'auto',boxShadow:'0 12px 48px rgba(0,0,0,0.15)'}}>
        <h3 style={{fontSize:18,fontWeight:700,color:COLORS.text,margin:'0 0 6px 0',fontFamily:"'Playfair Display',Georgia,serif"}}>{t.adminTitle}</h3>
        <p style={{fontSize:13,color:COLORS.muted,margin:'0 0 16px 0'}}>{t.adminDesc}</p>
        <div style={{display:'flex',gap:0,marginBottom:20,background:COLORS.bg,borderRadius:10,padding:3}}>
          {tabBtn('email','\u{1F4E7} '+t.emailTab,0)}
          {tabBtn('manual','\u270F\uFE0F '+t.manualTab,0)}
          {tabBtn('cancellations','\u274C '+t.cancellationsTab,pending.length)}
          {tabBtn('payments','\u{1F4B3} '+t.paymentsTab,0)}
          {tabBtn('bookings','\u{1F4C5} '+t.bookingsTab,0)}
          {tabBtn('board','\u{1F451} '+t.boardTab,0)}
        </div>

        {tab==='bookings' && <BookingManager bookings={bookings} weeks={weeks} onEditBooking={onEditBooking} onDeleteBooking={onDeleteBooking} t={t} lang={lang}/>}

        {tab==='email' && <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <textarea style={{...iS,resize:'vertical'}} rows={6} placeholder={t.pasteEmail} value={emailText} onChange={e=>setEmailText(e.target.value)}/>
          <button onClick={handleParseEmail} disabled={parsing} style={{padding:'11px 0',background:parsing?'#D4C5B5':COLORS.accent,border:'none',borderRadius:10,fontSize:14,fontWeight:600,color:'white',cursor:parsing?'default':'pointer',fontFamily:"'DM Sans',sans-serif"}}>{parsing?t.parsing:t.parseEmail}</button>
          {parseResult && !parseResult.error && <div style={{background:'#F8F5F2',borderRadius:10,padding:16}}>
            <div style={{fontSize:13,fontWeight:700,color:COLORS.text,marginBottom:8}}>{t.parsedResult}</div>
            <div style={{fontSize:13}}><strong>{t.parsedName}:</strong> {parseResult.parsed_name || t.noMatch}</div>
            <div style={{fontSize:13}}><strong>{t.parsedWeek}:</strong> {parseResult.parsed_week || t.weekNotFound}</div>
            {parseResult.matched_user && parseResult.matched_week && <button onClick={()=>{onBooked(parseResult.matched_week.id,parseResult.matched_user,'regular');onClose();}} style={{marginTop:12,padding:'10px 20px',background:COLORS.success,border:'none',borderRadius:10,fontSize:14,fontWeight:600,color:'white',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.confirmBooking}</button>}
          </div>}
          {parseResult && parseResult.error && <div style={{background:'#FEF2F2',padding:'10px 14px',borderRadius:8,fontSize:13,color:COLORS.danger}}>{t.parseError}</div>}
        </div>}

        {tab==='manual' && <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div><label style={{fontSize:12,fontWeight:600,color:'#5A4D40',display:'block',marginBottom:6}}>{t.owner}</label>
            <select value={selUser} onChange={e=>setSelUser(e.target.value)} style={iS}>
              <option value="">{t.pickOwner}</option>

          {pending.length===0 ? <div style={{padding:24,textAlign:'center',color:COLORS.muted,fontSize:14}}>{t.noPendingCancellations}</div>
          : pending.map(b=>{const w=weeks.find(wk=>wk.id===b.week_id);const br=FAMILY_BRANCHES.find(x=>x.id===b.branch_id);
            return <div key={b.id} style={{padding:'14px 16px',background:'#FEF2F2',border:'1px solid #B8504230',borderRadius:10,display:'flex',alignItems:'center',gap:12}}>
              <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,color:COLORS.text}}>{b.user_name}</div><div style={{fontSize:12,color:COLORS.muted,marginTop:2}}>{br?br.name:''} &middot; {w?'W'+w.weekNum+': '+formatDate(w.start,lang)+' \u2013 '+formatDate(w.end,lang):b.week_id}</div></div>
              <button onClick={()=>onApproveCancellation(b.id)} style={{padding:'6px 14px',background:COLORS.success,border:'none',borderRadius:8,fontSize:12,color:'white',cursor:'pointer',fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>{t.approveCancellation}</button>
              <button onClick={()=>onRejectCancellation(b.id)} style={{padding:'6px 14px',background:'transparent',border:'1.5px solid #D4C5B5',borderRadius:8,fontSize:12,color:COLORS.muted,cursor:'pointer',fontWeight:500,fontFamily:"'DM Sans',sans-serif"}}>{t.rejectCancellation}</button>
            </div>;})}
          <button onClick={onClose} style={{marginTop:8,padding:'11px 0',background:'#F5F0EB',border:'none',borderRadius:10,fontSize:14,fontWeight:500,color:'#5A4D40',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.close}</button>
        </div>}

        {tab==='payments' && <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',gap:8,marginBottom:8}}>
            <button onClick={()=>setUnpaidOnly(false)} style={{padding:'6px 14px',borderRadius:8,border:'none',background:!unpaidOnly?COLORS.text:'#E8DFD5',color:!unpaidOnly?COLORS.white:COLORS.muted,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.allPayments}</button>
            <button onClick={()=>setUnpaidOnly(true)} style={{padding:'6px 14px',borderRadius:8,border:'none',background:unpaidOnly?COLORS.text:'#E8DFD5',color:unpaidOnly?COLORS.white:COLORS.muted,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.filterUnpaid}</button>
          </div>
          {paymentBookings.length===0 ? <div style={{padding:24,textAlign:'center',color:COLORS.muted,fontSize:14}}>{t.noData}</div>
          : paymentBookings.map(b=>{const w=weeks.find(wk=>wk.id===b.week_id);const br=FAMILY_BRANCHES.find(x=>x.id===b.branch_id);
            return <div key={b.id} style={{padding:'12px 14px',background:'#F8F5F2',borderRadius:10,display:'flex',alignItems:'center',gap:10,borderLeft:'3px solid '+(br?br.color:'#ccc')}}>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:COLORS.text}}>{b.user_name}</div><div style={{fontSize:11,color:COLORS.muted}}>{w?'W'+w.weekNum+': '+formatDate(w.start,lang)+' \u2013 '+formatDate(w.end,lang):b.week_id}</div></div>
              {paymentBadge(b.payment_status||'not_paid',t)}
              <select value={b.payment_status||'not_paid'} onChange={e=>onUpdatePayment(b.id,e.target.value)} style={{padding:'4px 8px',border:'1px solid '+COLORS.border,borderRadius:6,fontSize:11,background:'white',fontFamily:"'DM Sans',sans-serif"}}>
                <option value="not_paid">{t.notPaid}</option><option value="invoice_sent">{t.invoiceSent}</option><option value="paid">{t.paid}</option>
              </select>
            </div>;})}
          <button onClick={onClose} style={{marginTop:8,padding:'11px 0',background:'#F5F0EB',border:'none',borderRadius:10,fontSize:14,fontWeight:500,color:'#5A4D40',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.close}</button>
        </div>}

        {tab==='board' && <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <h4 style={{fontSize:14,fontWeight:700,color:COLORS.text,margin:0}}>{editingId?t.editEvent:t.createBoardEvent}</h4>
          <input style={iS} type="text" placeholder={t.eventName} value={evName} onChange={e=>setEvName(e.target.value)}/>
          <textarea style={{...iS,resize:'vertical'}} rows={2} placeholder={t.eventDesc} value={evDesc} onChange={e=>setEvDesc(e.target.value)}/>
          <div style={{display:'flex',gap:8}}>
            <div style={{flex:1}}><label style={{fontSize:11,fontWeight:600,color:COLORS.muted,display:'block',marginBottom:4}}>{t.eventStart}</label><input style={iS} type="date" value={evStart} onChange={e=>setEvStart(e.target.value)}/></div>
            <div style={{flex:1}}><label style={{fontSize:11,fontWeight:600,color:COLORS.muted,display:'block',marginBottom:4}}>{t.eventEnd}</label><input style={iS} type="date" value={evEnd} onChange={e=>setEvEnd(e.target.value)}/></div>
          </div>
          <button onClick={handleCreateEvent} disabled={!evName||!evStart||!evEnd} style={{padding:'11px 0',background:(!evName||!evStart||!evEnd)?'#D4C5B5':COLORS.board,border:'none',borderRadius:10,fontSize:14,fontWeight:600,color:'white',cursor:(!evName||!evStart||!evEnd)?'default':'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.createBoardEvent}</button>
          <button onClick={onClose} style={{padding:'11px 0',background:'#F5F0EB',border:'none',borderRadius:10,fontSize:14,fontWeight:500,color:'#5A4D40',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>{t.close}</button>
        </div>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// WEEK ROW
// ═══════════════════════════════════════════════════════
function WeekRow({week, myBooking, allBookings=[], gcalEvents=[], boardEvents=[], onBook, onRequestCancel, onToggleShare, onJoinSpecialEvent, onJoinBooking, onOpenProfile, isFamily=false, user, phase, clanBookedByBranch, userBookedPriority, phaseActive, t, lang, highlight}){
  const hasMyBooking = !!myBooking;
  const userBranch = FAMILY_BRANCHES.find(b=>b.id===user.branch_id);
  const isPending = hasMyBooking && myBooking.cancellation_status==='pending';
  let weekBookedByOther=false, weekNotOpen=false, partialBlock=null, specialEvent=null;
  if(!hasMyBooking && (phase==='regular'||phase==='clan'||phase==='priority')){
    const confirmed = allBookings.filter(b=>b.week_id===week.id && b.cancellation_status!=='approved');
    // For regular bookings, work out per-day occupancy from gcal so a single
    // legacy event in the middle of the week doesn't block the entire week.
    const ws=week.start, we=week.end;
    const dayBlocked = {}; // ISO -> true
    const allDays = [];
    {
      const d = new Date(ws); const endD = new Date(we);
      while (d <= endD) { const iso = toISO(d); allDays.push(iso); dayBlocked[iso]=false; d.setDate(d.getDate()+1); }
    }
    // A stay occupies NIGHTS: [check-in, departure). The departure day is
    // free again for the next arrival, so ranges are half-open. A booking
    // without custom dates takes the whole week and departs the day after.
    const addDay=(iso,n)=>{const d=new Date(iso);d.setDate(d.getDate()+n);return toISO(d);};
    confirmed.forEach(b=>{
      const cs=b.check_in_date||ws, ce=b.check_out_date||addDay(we,1);
      allDays.forEach(d=>{ if(d>=cs && d<ce) dayBlocked[d]=true; });
    });
    // Google Calendar: multi-day entries name the departure day (family
    // convention); single-day entries occupy that one day.
    (gcalEvents||[]).forEach(ev=>{
      const es=ev.start_date||''; if(!es) return;
      const raw=ev.end_date||es, ee=(raw>es)?raw:addDay(es,1);
      allDays.forEach(d=>{ if(d>=es && d<ee) dayBlocked[d]=true; });
    });
    // Special events reserve their dates too — block them and remember the
    // event so we can offer a "join special event" action on this week.
    (boardEvents||[]).forEach(ev=>{
      const es=ev.start_date||'', ee=ev.end_date||es; if(!es) return;
      let overlaps=false;
      allDays.forEach(d=>{ if(d>=es && d<=ee){ dayBlocked[d]=true; overlaps=true; } });
      if(overlaps && !specialEvent) specialEvent=ev;
    });
    // The suggested custom range should end on the departure day, i.e. the
    // day after the last free night, so a changeover is bookable.
    const blockedCount = allDays.filter(d=>dayBlocked[d]).length;
    if(phase==='regular'){
      if(blockedCount===allDays.length) weekBookedByOther = true;
      else if(blockedCount>0){
        // Compute the longest free contiguous range so we can suggest one.
        let bestStart=null, bestEnd=null, bestLen=0, curStart=null;
        for(const d of allDays){
          if(!dayBlocked[d]){
            if(!curStart) curStart=d;
            const len = (new Date(d)-new Date(curStart))/(1000*60*60*24)+1;
            if(len>bestLen){ bestLen=len; bestStart=curStart; bestEnd=d; }
          } else { curStart=null; }
        }
        partialBlock = { freeStart: bestStart, freeEnd: bestEnd?addDay(bestEnd,1):bestEnd, blockedCount, totalCount: allDays.length };
      }
      if(!isWeekBookableRegular(week.start)) weekNotOpen=true;
    } else {
      // Clan/Priority book a whole week — any occupied day blocks it. Blind
      // bookings still count, so a week can never be double-booked.
      if(blockedCount>0) weekBookedByOther = true;
    }
  }
  // An open-to-share booking by someone else on this week: everyone,
  // including family members, may join it.
  const shareBooking = allBookings.find(b=>b.week_id===week.id && b.open_to_share
                                        && b.user_id!==user.id && b.cancellation_status!=='approved');
  const joinedShare = !!(shareBooking && (shareBooking.linked_user_ids||[]).map(Number).includes(user.id));
  let bookable=false, reason='';
  if(!hasMyBooking && phaseActive && !isFamily){
    if(phase==='clan'){if(clanBookedByBranch)reason=t.branchAlreadyBooked;else if(weekBookedByOther)reason=t.weekBookedByOther;else bookable=true;}
    else if(phase==='priority'){if(userBookedPriority)reason=t.youAlreadyBooked;else if(weekBookedByOther)reason=t.weekBookedByOther;else bookable=true;}
    else{if(weekBookedByOther)reason=t.weekBookedByOther;else if(weekNotOpen)reason=t.weekNotYetOpen+' '+formatFullDate(regularOpenDate(week.start),lang);else bookable=true;}
  }
  // Who is in the house this week. Blind clan/priority bookings arrive
  // from the API already anonymised, so nothing leaks before the reveal.
  const addDayISO=(iso,k)=>{const d=parseISO(iso);d.setDate(d.getDate()+k);return toISO(d);};
  const weekDep = weekDeparture(week);
  const occupants = [];
  allBookings.forEach(b=>{
    if(b.cancellation_status==='approved') return;
    const bs=b.check_in_date||week.start, be=b.check_out_date||addDayISO(week.end,1);
    if(!(bs < weekDep && week.start < be)) return;
    if(b.is_hidden || !b.user_name) occupants.push({name:t.booked,hidden:true,shared:false});
    else occupants.push({name:b.user_name,hidden:false,shared:!!b.open_to_share,userId:b.user_id,
                         from:b.check_in_date,to:b.check_out_date,mine:b.user_id===user.id});
  });
  legacyGcalOnly(gcalEvents, allBookings, ()=>week).forEach(ev=>{
    const r = gcalNightRange(ev); if(!r) return;
    if(r[0] < weekDep && week.start < r[1]) occupants.push({name:ev.title||'—',gcal:true});
  });
  const barColor = hasMyBooking&&myBooking.open_to_share ? COLORS.openToShare : (userBranch?userBranch.color:'#ccc');
  const pm = hasMyBooking ? getPhaseMeta(myBooking.phase,t) : null;

  return (
    <div data-week-id={week.id} style={{display:'flex',alignItems:'center',padding:'10px 16px',borderRadius:10,background:highlight?COLORS.success+'18':isPending?'#FEF2F210':hasMyBooking?barColor+'0D':'transparent',transition:'all 0.2s',gap:12,borderLeft:highlight?'3px solid '+COLORS.success:isPending?'3px solid '+COLORS.warning:hasMyBooking?'3px solid '+barColor:'3px solid transparent',opacity:isPending?0.7:1}}>
      <div style={{width:36,textAlign:'center',fontSize:13,fontWeight:600,color:COLORS.muted}}>W{week.weekNum}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:14,fontWeight:500,color:COLORS.text,textDecoration:isPending?'line-through':'none'}}>{formatDate(week.start,lang)} &mdash; {formatDate(weekDeparture(week),lang)}</div>
        {hasMyBooking && !isPending && <div style={{display:'flex',alignItems:'center',gap:6,marginTop:2}}>
          <span style={{fontSize:12,color:barColor,fontWeight:600}}>{t.yourBooking} &middot; {pm?pm.name:myBooking.phase}{myBooking.open_to_share?' \u00B7 \u{1F91D}':''}{myBooking.admin_booked?' \u00B7 '+t.adminBooking:''}</span>
        </div>}
        {hasMyBooking && myBooking.remarks && <div style={{fontSize:11,color:COLORS.muted,marginTop:2,fontStyle:'italic'}}>{'\u{1F4AC}'} {myBooking.remarks}</div>}
        {isPending && <div style={{fontSize:12,color:COLORS.warning,fontWeight:600,marginTop:2}}>{'\u23F3'} {t.pendingCancellation}</div>}
        {!hasMyBooking && occupants.length>0 && <div style={{fontSize:11,color:COLORS.muted,marginTop:2,display:'flex',flexWrap:'wrap',gap:6}}>
          {occupants.map((o,i)=>o.userId && onOpenProfile
            ? <span key={i} style={{display:'inline-flex',alignItems:'center',gap:4}}>
                <MemberLink user={{user_id:o.userId,display_name:o.name,branch_id:0}} onOpen={onOpenProfile} size={18} color={COLORS.text}
                  style={{fontWeight:600,fontSize:11}}/>
                {o.shared?<span style={{color:'#8A6D00'}}>{'\u{1F91D}'}</span>:null}
              </span>
            : <span key={i} style={{color:o.hidden?'#B0A090':o.gcal?COLORS.gcal:COLORS.text,fontWeight:o.hidden?400:600}}>
                {o.hidden?o.name:(t.bookedBy+': '+o.name)}{o.shared?' \u00B7 \u{1F91D}':''}{o.gcal?' \u00B7 '+t.viaOldCalendar:''}
              </span>)}
        </div>}
        {!hasMyBooking && reason && !specialEvent && occupants.length===0 && <div style={{fontSize:11,color:weekBookedByOther?COLORS.danger:'#B0A090',marginTop:2}}>{reason}</div>}
        {!hasMyBooking && specialEvent && <div style={{fontSize:11,color:COLORS.board,marginTop:2,fontWeight:600}}>{'\u2728'} {specialEvent.name} &middot; {t.reservedForEvent}</div>}
        {!hasMyBooking && bookable && partialBlock && <div style={{fontSize:11,color:'#C4853B',marginTop:2}}>{'\u26A0\uFE0F'} {partialBlock.blockedCount}/{partialBlock.totalCount} {lang==='nl'?'dagen geboekt \u2014 kies aangepaste data':'days taken \u2014 pick custom dates'} ({formatDate(partialBlock.freeStart,lang)} \u2192 {formatDate(partialBlock.freeEnd,lang)})</div>}
      </div>
      <div style={{display:'flex',gap:6}}>
        {!hasMyBooking && shareBooking && onJoinBooking && <button onClick={()=>onJoinBooking(shareBooking, joinedShare)} style={{padding:'6px 14px',background:joinedShare?'transparent':COLORS.openToShare,border:'1.5px solid '+COLORS.openToShare,borderRadius:8,fontSize:12,color:joinedShare?'#8A6D00':'#4A3B00',cursor:'pointer',fontWeight:600,whiteSpace:'nowrap',fontFamily:"'DM Sans',sans-serif"}}>{joinedShare?('\u2715 '+t.leaveBooking):('\u{1F91D} '+t.joinBooking)}</button>}
        {!hasMyBooking && specialEvent && <button onClick={()=>onJoinSpecialEvent&&onJoinSpecialEvent(specialEvent)} style={{padding:'6px 14px',background:COLORS.board,border:'none',borderRadius:8,fontSize:12,color:COLORS.white,cursor:'pointer',fontWeight:600,fontFamily:"'DM Sans',sans-serif",whiteSpace:'nowrap'}}>{'\u2728'} {t.joinSpecialEvent}</button>}
        {hasMyBooking && !isPending && onToggleShare && <button onClick={()=>onToggleShare(myBooking)} title={t.openToShare} style={{padding:'6px 14px',background:myBooking.open_to_share?COLORS.openToShare+'22':'transparent',border:'1.5px solid '+(myBooking.open_to_share?COLORS.openToShare:'#D4C5B5'),borderRadius:8,fontSize:12,color:myBooking.open_to_share?'#8A6D00':COLORS.muted,cursor:'pointer',fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>{myBooking.open_to_share?('\u{1F91D} '+t.makePrivate):t.makeShare}</button>}
        {hasMyBooking && !isPending && <button onClick={()=>onRequestCancel(myBooking)} style={{padding:'6px 14px',background:'transparent',border:'1.5px solid #D4C5B5',borderRadius:8,fontSize:12,color:COLORS.muted,cursor:'pointer',fontWeight:500,fontFamily:"'DM Sans',sans-serif"}}>{t.requestCancel}</button>}
        {isPending && <span style={{fontSize:11,color:COLORS.warning,fontWeight:600}}>{'\u23F3'}</span>}
        {!hasMyBooking && bookable && <button onClick={()=>onBook(week, partialBlock)} style={{padding:'6px 14px',background:COLORS.success,border:'none',borderRadius:8,fontSize:12,color:COLORS.white,cursor:'pointer',fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>{t.bookBtn}</button>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// BOOKING VIEW (main booking screen)
// ═══════════════════════════════════════════════════════
function BookingView({user, bookings=[], myBookings=[], weeks, year, setYear, phase, setPhase, phaseConfig, filterMonth, setFilterMonth, onSelectBranch, onShowAdmin, onBook, onRequestCancel, onToggleShare, onSaveGuests, boardEvents=[], gcalEvents=[], gcalLoading=false, onSignUpBoard, onUnsignUpBoard, onDeleteEvent, onUpdateEvent, onCreateEvent, onJoinBooking, onOpenProfile, shareDefault=false, isFamily=false, registeredUsers=[], branchData=[], showToast, t, lang, pendingBookDate, clearPendingBookDate}){
  const [costBooking, setCostBooking] = React.useState(null);
  const [bookDialog, setBookDialog] = React.useState(null);
  // Inline "create special event" form state
  const [showNewEvent, setShowNewEvent] = React.useState(false);
  const [evName, setEvName] = React.useState('');
  const [evStart, setEvStart] = React.useState('');
  const [evEnd, setEvEnd] = React.useState('');
  const [evDesc, setEvDesc] = React.useState('');
  const [evMax, setEvMax] = React.useState('');
  const [eventDetail, setEventDetail] = React.useState(null);
  // When set, the form below edits that event instead of creating a new one.
  const [editingId, setEditingId] = React.useState(null);
  const resetEventForm = ()=>{
    setEvName('');setEvStart('');setEvEnd('');setEvDesc('');setEvMax('');
    setEditingId(null);setShowNewEvent(false);
  };
  const startEditEvent = (ev)=>{
    setEditingId(ev.id);
    setEvName(ev.name||'');setEvStart(ev.start_date||'');setEvEnd(ev.end_date||'');
    setEvDesc(ev.description||'');setEvMax(ev.max_participants!=null?String(ev.max_participants):'');
    setShowNewEvent(true);
    setEventDetail(null);
  };
  const submitEvent = async ()=>{
    if(!evName || !evStart || !evEnd) return;
    if(evEnd < evStart){ if(showToast) showToast(t.endBeforeStart); return; }
    const payload = {name:evName,start_date:evStart,end_date:evEnd,description:evDesc,max_participants:evMax?parseInt(evMax):null};
    if(editingId) await onUpdateEvent(editingId, payload);
    else await onCreateEvent(payload);
    resetEventForm();
  };

  const myBookingMap = {};
  myBookings.filter(b=>b.year===year).forEach(b=>{if(b.week_id)myBookingMap[b.week_id]=b;});
  const clanBookedByBranch = bookings.find(b=>b.branch_id===user.branch_id && b.phase==='clan' && b.cancellation_status!=='approved');
  const userBookedPriority = bookings.find(b=>(b.user_id===user.id) && b.phase==='priority' && b.cancellation_status!=='approved');
  const filteredWeeks = filterMonth!==null ? weeks.filter(w=>w.month===filterMonth) : weeks;
  // Highlight a target week when user clicks a date in the calendar.
  const [highlightWeekId, setHighlightWeekId] = React.useState(null);
  React.useEffect(()=>{
    if(!pendingBookDate || !weeks.length) return;
    const w = weeks.find(wk=>pendingBookDate>=wk.start && pendingBookDate<=wk.end);
    if(!w){ if(clearPendingBookDate) clearPendingBookDate(); return; }
    setFilterMonth(w.month);
    setHighlightWeekId(w.id);
    setBookDialog({week:w, phase:'regular', presetCheckIn:pendingBookDate});
    setTimeout(()=>{
      const el = document.querySelector('[data-week-id="'+w.id+'"]');
      if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 50);
    setTimeout(()=>setHighlightWeekId(null), 4000);
    if(clearPendingBookDate) clearPendingBookDate();
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[pendingBookDate, weeks.length]);
  const userBranch = FAMILY_BRANCHES.find(b=>b.id===user.branch_id);
  const branchCounts = {};
  (branchData||[]).forEach(br=>{branchCounts[br.id]=br.member_count||0;});

  return (
    <div className="fargny-booking-layout" style={{display:'flex',maxWidth:1200,margin:'0 auto',gap:24,padding:'24px 20px'}}>
